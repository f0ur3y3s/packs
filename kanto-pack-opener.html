/* ---------- holo shader ---------- */
const HOLO_VS = `
varying vec2 vUv; varying vec3 vN; varying vec3 vP;
varying vec3 vWN; varying vec3 vWP;
void main(){
  vUv = uv;
  vN = normalize(normalMatrix * normal);
  // World space as well, so the card can reflect the room rather than
  // something fixed to the camera.
  vWN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position,1.0);
  vWP = wp.xyz;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  vP = mv.xyz;
  gl_Position = projectionMatrix * mv;
}`;
const HOLO_FS = `
uniform sampler2D uMap;
uniform sampler2D uMask;
uniform float uTime;
uniform float uHolo;
uniform float uGold;
uniform vec2  uTilt;
uniform sampler2D uEnv;
varying vec2 vUv; varying vec3 vN; varying vec3 vP;
varying vec3 vWN; varying vec3 vWP;

// Equirectangular lookup: the room, sampled by where the surface points.
vec3 envSample(vec3 R){
  vec2 uv = vec2(atan(R.z, R.x)*0.15915 + 0.5, asin(clamp(R.y,-1.0,1.0))*0.31831 + 0.5);
  return texture2D(uEnv, uv).rgb;
}

float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

// The art window in UV space: x 42..470 of 512, y 136..422 of 716 measured
// down the canvas, so v runs the other way.
const vec2 ART0 = vec2(0.0820, 0.4106);
const vec2 ART1 = vec2(0.9180, 0.8101);

void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(-vP);
  float facing = clamp(dot(N,V),0.0,1.0);
  vec3 Rv = reflect(-V, N);

  // No UV parallax here any more. It used to fake the art sitting behind the
  // card surface by shifting what was sampled inside the window; the sprite is
  // now a separate surface in front of the card and parallaxes for real, so
  // doing both would double the movement. inArt is still wanted, to keep the
  // emboss off the pixel art and to place the window's inner shadow.
  vec2 uvS = vUv;
  float inArt = step(ART0.x, vUv.x) * step(vUv.x, ART1.x)
              * step(ART0.y, vUv.y) * step(vUv.y, ART1.y);
  vec4 base = texture2D(uMap, uvS);
  vec3 col = base.rgb;

  // Inner shadow around the window, deepest on the side the light comes from,
  // which is what a recess actually does.
  vec2 dIn = min(vUv - ART0, ART1 - vUv);
  float lipX = 1.0 - smoothstep(0.0, 0.030, dIn.x);
  float lipY = 1.0 - smoothstep(0.0, 0.022, dIn.y);
  float lip = max(lipX, lipY) * inArt;
  vec2 lightDir = normalize(vec2(-0.5, 0.86) + vec2(uTilt.y, -uTilt.x)*0.5);
  float side = 0.5 + 0.5*dot(normalize((vUv - 0.5) + vec2(1e-5)), lightDir);
  col *= 1.0 - lip*(0.10 + 0.24*side);

  // Faint edge sheen. This used to be 0.13 and lifted the whole card toward
  // white; foil should catch light, not glow.
  col += pow(1.0-facing, 4.0) * 0.045;

  // Bevel. A printed card is not a flat decal: the last millimetre catches
  // light on one side and falls into shadow on the other. Cheap here because
  // the distance to the edge is just a UV term.
  vec2 fromEdge = min(vUv, 1.0-vUv);
  float edgeD = min(fromEdge.x*(1.0/0.030), fromEdge.y*(1.0/0.021));
  float bevel = 1.0 - clamp(edgeD, 0.0, 1.0);
  // Light comes from upper-left, so the top and left edges catch and the
  // bottom and right fall away.
  vec2 dir = normalize(vec2(0.55, -0.85) + vec2(uTilt.y, -uTilt.x)*0.6);
  vec2 toEdge = normalize((vUv - 0.5) + vec2(1e-5));
  float lit = dot(toEdge, dir);
  col += bevel * lit * 0.16;
  col *= 1.0 - bevel * 0.10;

  // Specular off the key light, so the whole face brightens through an angle
  // instead of being uniformly flat.
  vec3 L = normalize(vec3(0.45, 0.72, 0.86));
  vec3 H = normalize(L + V);
  // Broad, not tight: on a flat card N is constant and only V varies, so a
  // high exponent snaps from lit to unlit across the face and draws a hard
  // diagonal edge. A low one reads as a gentle sheen.
  col += pow(clamp(dot(N,H),0.0,1.0), 9.0) * 0.055;

  // Print relief. The luminance gradient of the artwork stands in for a height
  // map, so borders, rules and type catch the key light on one side and fall
  // away on the other. Held right down inside the art window: the sprite is
  // pixel art with hard edges everywhere and embossing all of them turns it
  // into foil lettering.
  {
    vec2 tx = vec2(1.6/512.0, 1.6/716.0);
    float hl = dot(texture2D(uMap, uvS - vec2(tx.x,0.0)).rgb, vec3(0.299,0.587,0.114));
    float hr = dot(texture2D(uMap, uvS + vec2(tx.x,0.0)).rgb, vec3(0.299,0.587,0.114));
    float hd = dot(texture2D(uMap, uvS - vec2(0.0,tx.y)).rgb, vec3(0.299,0.587,0.114));
    float hu = dot(texture2D(uMap, uvS + vec2(0.0,tx.y)).rgb, vec3(0.299,0.587,0.114));
    vec2 lit2 = normalize(vec2(-0.55, 0.84) + vec2(uTilt.y, -uTilt.x)*0.45);
    float emboss = dot(vec2(hr-hl, hu-hd), lit2);
    col += emboss * mix(0.30, 0.07, inArt);
  }

  // Reflected room. Weighted by fresnel, so it is barely there face-on and
  // builds as the card turns away -- which is how a laminated card behaves,
  // and it is what stops the surface reading as lit-but-nowhere.
  vec3 WN = normalize(vWN);
  vec3 Vw = normalize(cameraPosition - vWP);
  float fres = pow(1.0 - clamp(dot(WN, Vw), 0.0, 1.0), 3.2);
  col += envSample(reflect(-Vw, WN)) * (0.055 + 0.44*fres);

  float m = texture2D(uMask, vUv).r * uHolo;
  if(m > 0.003){
    // Everything below is driven by the reflection vector, so the foil only
    // moves when the card does. The old version swept on uTime alone, which
    // is the main reason a resting card looked fake: real foil is still when
    // you are still. Time is left in at a crawl so it never looks frozen.
    vec2 r = vec2(Rv.x + uTilt.x*0.55, Rv.y + uTilt.y*0.55);

    // Diffraction: hue depends on angle across the sheet, not on screen
    // position alone, so tilting cycles the colours instead of sliding a
    // fixed gradient around.
    float d = (vUv.x-0.5)*1.1 + (vUv.y-0.5)*1.9 + r.x*3.4 + r.y*2.6 + uTime*0.015;
    vec3 rb = 0.5 + 0.5*cos(6.28318*(d + vec3(0.0,0.33,0.67)));
    rb = mix(rb, mix(rb, vec3(1.0,0.82,0.38), 0.7), uGold);

    // Specular lobe: bright near the mirror angle, almost nothing away from
    // it. This is what makes the sheet light up as it passes through an angle.
    float lobe = pow(clamp(1.0 - length(r)*0.78, 0.0, 1.0), 2.2);

    // Fine grating lines, swept by the same vector.
    float lines = 0.5 + 0.5*sin(6.28318*((vUv.y*1.35 - vUv.x*0.55)*8.0 - (r.x+r.y)*4.5));
    float grate = mix(0.72, 1.0, lines);

    // Additive rather than mixing the art toward flat rainbow, so the
    // illustration stays legible under the foil.
    float amt = m * (0.14 + 0.86*lobe) * grate;
    col += rb * amt * 0.62;

    // Sparkle, gated by the lobe so a card held flat-on isn't covered in
    // white speckles.
    vec2 g = floor(vUv*vec2(104.0,146.0));
    float rv = h21(g);
    float tw = step(0.952, fract(rv*7.13 + r.x*0.8 + r.y*0.6));
    col += rb * tw * m * lobe * 0.75;
  }
  gl_FragColor = vec4(col, 1.0);
}`;

// Advance one card's sprite animation. Only the art window is repainted, and
// only when the frame actually changes — GIF frames land around 10-20fps, so
// this re-uploads the card texture far less often than once per rendered frame.
// A single soft quad that tracks whichever card is in focus, rather than one
// per card: ten stacked shadows muddy into a grey smear, and a shadow parented
// to the card would swing round in front of it on the flip.
let cardShadow = null;
const copyAt = new THREE.Vector2();
function ensureCardShadow(){
  if(cardShadow) return cardShadow;
  const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(S/2,S/2,S*0.10, S/2,S/2,S*0.50);
  g.addColorStop(0,   "rgba(0,0,0,0.60)");
  g.addColorStop(0.55,"rgba(0,0,0,0.26)");
  g.addColorStop(1,   "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  cardShadow = new THREE.Mesh(
    new THREE.PlaneGeometry(CARD_MESH_W*1.6, CARD_MESH_H*1.45),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false})
  );
  cardShadow.renderOrder = -1;
  cardShadow.visible = false;
  scene.add(cardShadow);
  return cardShadow;
}

function stepCardArt(card, tSeconds){
  const a = card.art;
  if(!a || !card.spriteTex) return;
  const f = spriteFrameAt(a.rec, tSeconds*1000 + a.phase);
  if(f === a.frame) return;
  a.frame = f;
  // Only the sprite and its shadow, on a transparent ground. The card face
  // behind it is now completely static -- no part of it is re-uploaded at all.
  const x = a.ctx;
  x.clearRect(0, 0, a.w, a.h);
  drawSpriteFrame(x, a.rec, f, 0, 0, a.w, a.h);
  card.spriteTex.needsUpdate = true;
}

// Every card has the same back, so it was building ten identical 512x716
// canvases, ten textures (1.4 MB of GPU memory each) and ten materials.
let backMat = null;
function sharedBackMaterial(){
  if(backMat) return backMat;
  const tex = new THREE.CanvasTexture(buildCardBack());
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  // Scaled down deliberately. The scene runs ambient 0.72 plus two
  // directionals, which together land well above 1.0, and at full white the
  // back blew out: deep blue washed to pale, gold to near-white. The card face
  // does not show this because its shader samples the texture directly rather
  // than being lit.
  // No envMap on the back. Measured, the Phong environment reflections were the
  // most expensive thing added here, and on matte stock that is face-down most
  // of the time this one was barely visible. The rim keeps its reflection --
  // that edge is glossy and always in view.
  backMat = new THREE.MeshPhongMaterial({
    map: tex, color: 0x9fa2ab, shininess: 16, specular: 0x20242e
  });
  return backMat;
}

// A real card is a rounded slab with a soft edge, not a box. The sharp corners
// were a big part of why it read as flat: the silhouette gave it away before
// any shading did. ExtrudeGeometry gives rounded corners and a bevelled rim
// that catches the light all the way round.
//
// Two things have to be rebuilt afterwards. Extrude generates its own UVs from
// the shape outline, which do not map a card face, so they are recomputed from
// x/y across the card. And it groups both caps together, while the front and
// back need different materials, so the triangles are regrouped by facing.
// A room for the cards to reflect: dark floor, a warm horizon, a cool ceiling
// and one soft overhead light. Equirectangular, so a reflection vector maps
// straight onto it, and small because it is only ever seen blurred across a
// glossy surface.
let envTex = null;
function roomEnvTexture(){
  if(envTex) return envTex;
  const W = 256, H = 128;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0,0,0,H);
  g.addColorStop(0.00,"#cfd8ef");   // ceiling
  g.addColorStop(0.42,"#6d76a8");
  g.addColorStop(0.52,"#3c3f63");   // horizon
  g.addColorStop(1.00,"#0d0e1c");   // floor
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // Softbox overhead, plus a dimmer one behind, so turning the card sweeps
  // a highlight instead of holding a constant sheen.
  [[W*0.30, H*0.17, W*0.20, "rgba(255,250,235,.95)"],
   [W*0.78, H*0.26, W*0.13, "rgba(150,200,255,.55)"]].forEach(([lx,ly,lr,col])=>{
    const lg = x.createRadialGradient(lx,ly,1, lx,ly,lr);
    lg.addColorStop(0,col); lg.addColorStop(1,"rgba(0,0,0,0)");
    x.fillStyle=lg; x.fillRect(0,0,W,H);
  });
  envTex = new THREE.CanvasTexture(c);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.minFilter = THREE.LinearFilter; envTex.generateMipmaps = false;
  envTex.wrapS = THREE.RepeatWrapping;
  return envTex;
}

// The bow, shared: the sprite quad in front of the card has to ride the same
// curve or the gap between them opens up at the corners.
const CARD_BOW_W = d => d*2.9, CARD_BOW_H = d => d*1.05;
function cardBowAt(nx, ny, d){
  return (1 - Math.min(nx*nx,1))*CARD_BOW_W(d) + (1 - Math.min(ny*ny,1))*CARD_BOW_H(d);
}

function buildCardGeometry(w, h, d, r){
  const shape = new THREE.Shape();
  const x = -w/2, y = -h/2;
  shape.moveTo(x+r, y);
  shape.lineTo(x+w-r, y);   shape.quadraticCurveTo(x+w, y,   x+w, y+r);
  shape.lineTo(x+w, y+h-r); shape.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  shape.lineTo(x+r, y+h);   shape.quadraticCurveTo(x, y+h,   x, y+h-r);
  shape.lineTo(x, y+r);     shape.quadraticCurveTo(x, y,     x+r, y);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d, bevelEnabled: true,
    bevelThickness: d*0.32, bevelSize: d*0.32, bevelOffset: 0,
    bevelSegments: 2, curveSegments: 9
  });
  geo.center();
  geo.computeVertexNormals();

  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const uv = new Float32Array(pos.count*2);
  for(let i=0;i<pos.count;i++){
    let u = (pos.getX(i) + w/2) / w;
    const v = (pos.getY(i) + h/2) / h;
    // The back faces the other way, so its texture has to be mirrored or the
    // card back comes out reversed.
    if(nor.getZ(i) < -0.6) u = 1 - u;
    uv[i*2] = u; uv[i*2+1] = v;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));

  geo.clearGroups();
  const tris = pos.count/3;
  const faceOf = t => {
    let nz = 0;
    for(let k=0;k<3;k++) nz += nor.getZ(t*3+k);
    nz /= 3;
    return nz > 0.6 ? 0 : nz < -0.6 ? 1 : 2;   // front, back, rim
  };
  let runStart = 0, runMat = faceOf(0);
  for(let t=1;t<tris;t++){
    const m = faceOf(t);
    if(m !== runMat){ geo.addGroup(runStart*3, (t-runStart)*3, runMat); runMat = m; runStart = t; }
  }
  geo.addGroup(runStart*3, (tris-runStart)*3, runMat);

  // Bow the slab. A card is never dead flat, and a flat plane is the reason a
  // highlight flashes on and off across the whole face at once instead of
  // sweeping. Applied after the UVs and the front/back/rim grouping, both of
  // which classify against the flat normals, then normals are rebuilt so the
  // lighting follows the new surface.
  //
  // Done to the geometry rather than in the card's vertex shader, because the
  // rim and back are lit by standard materials and would not have followed.
  const bowW = CARD_BOW_W(d), bowH = CARD_BOW_H(d);
  for(let i=0;i<pos.count;i++){
    const nx = pos.getX(i)/(w/2), ny = pos.getY(i)/(h/2);
    pos.setZ(i, pos.getZ(i)
                + (1 - Math.min(nx*nx,1))*bowW
                + (1 - Math.min(ny*ny,1))*bowH);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// The art window as its own surface, sitting just in front of the card. This
// is what gives the sprite real depth: it is physically nearer the camera than
// the scene behind it, so it parallaxes against the frame on its own rather
// than through a UV trick, and it catches the light separately.
function buildSpriteQuad(){
  const qw = CARD_MESH_W * (428/CARD_W), qh = CARD_MESH_H * (286/CARD_H);
  const offY = (0.5 - (136 + 286/2)/CARD_H) * CARD_MESH_H;
  const geo = new THREE.PlaneGeometry(qw, qh, 14, 10);
  const pos = geo.attributes.position;
  const lift = CARD_MESH_D*0.5 + 0.011;
  for(let i=0;i<pos.count;i++){
    // Vertices are quad-local; the bow is defined across the whole card.
    const cardX = pos.getX(i), cardY = pos.getY(i) + offY;
    const nx = cardX/(CARD_MESH_W/2), ny = cardY/(CARD_MESH_H/2);
    pos.setZ(i, cardBowAt(nx, ny, CARD_MESH_D) + lift);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  geo.translate(0, offY, 0);
  return geo;
}

function makeCardMesh(card){
  const faces = buildCardFace(card);
  card.frontCanvas = faces.front;
  const tex = new THREE.CanvasTexture(faces.front);
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const mask = new THREE.CanvasTexture(faces.mask);
  mask.minFilter = THREE.LinearFilter; mask.generateMipmaps = false;

  const frontMat = new THREE.ShaderMaterial({
    uniforms:{
      uMap:{value:tex}, uMask:{value:mask},
      uTime:{value:0}, uHolo:{value:0}, uGold:{value: card.holo==="rare"?1:0},
      uTilt:{value:new THREE.Vector2(0,0)}, uEnv:{value: roomEnvTexture()}
    },
    vertexShader:HOLO_VS, fragmentShader:HOLO_FS
  });
  const backMat = sharedBackMaterial();
  // The sides used to be unlit near-white (#f2efe6), so they rendered brighter
  // than the shaded front and ringed every card in glowing white. Use the
  // card's own dark border tone, and shade it: an unlit side gives the card
  // away as a flat box the moment it turns.
  const edgeMat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(faces.edge || "#6b6459"), shininess: 18, specular: 0x55504a,
    envMap: roomEnvTexture(), reflectivity: 0.30, combine: THREE.MixOperation
  });
  // Card stock is a pale core between two printed faces, and that is what you
  // actually see along the edge of a real card. Keyed off the normal's z rather
  // than the vertex's: the bow moves z by more than the card is thick, but the
  // bevels still face partly forward or back while the straight side does not.
  edgeMat.onBeforeCompile = shader => {
    shader.vertexShader = "varying float vFace;\n" + shader.vertexShader.replace(
      "#include <begin_vertex>", "#include <begin_vertex>\n  vFace = normal.z;");
    shader.fragmentShader = "varying float vFace;\n" + shader.fragmentShader.replace(
      "#include <color_fragment>",
      "#include <color_fragment>\n  {\n" +
      "    float core = 1.0 - smoothstep(0.06, 0.42, abs(vFace));\n" +
      "    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.95,0.93,0.86), core*0.88);\n" +
      "  }");
  };

  if(card.art){
    card.spriteTex = new THREE.CanvasTexture(card.art.canvas);
    card.spriteTex.minFilter = THREE.LinearFilter;
    card.spriteTex.magFilter = THREE.NearestFilter;   // it is pixel art
    card.spriteTex.generateMipmaps = false;
  }

  // Corner radius matched to the 30px radius the card face is drawn with, so
  // the mesh silhouette lines up with the artwork's own rounded corners.
  const geo = buildCardGeometry(CARD_MESH_W, CARD_MESH_H, CARD_MESH_D,
                                CARD_MESH_W * (30/CARD_W));
  const mesh = new THREE.Mesh(geo, [frontMat, backMat, edgeMat]);
  const pivot = new THREE.Group();
  pivot.add(mesh);

  if(card.spriteTex){
    const spriteMat = new THREE.MeshBasicMaterial({
      map: card.spriteTex, transparent: true, depthWrite: false
    });
    const spriteMesh = new THREE.Mesh(buildSpriteQuad(), spriteMat);
    spriteMesh.renderOrder = 2;    // after the card's opaque face
    mesh.add(spriteMesh);          // rides the card, including the flip
    card.spriteMesh = spriteMesh;
  }
  card.mesh = mesh; card.pivot = pivot; card.frontMat = frontMat;
  return pivot;
}

/* ---------- pack meshes ---------- */
// The wrapper has to be genuinely bigger than what it holds: wider and taller
// than a card (1.72 x 2.405) with margin, and deep enough to stack ten of them
// without them intersecting each other.
const PACK = {
  w: 1.90, h: 2.85, d: 0.34,
  topH: 0.30
};
// hinge line for the tear flap: the rear face, so it peels away from the body
const TOP_PIVOT_Z = -PACK.d/2;
let packGroup=null, packBody=null, packTopPivot=null, packBodyJag=null, packTopJag=null;

function buildPackMeshes(){
  const art = buildPackArt();
  const backArt = buildPackBack();
  const bodyH = PACK.h - PACK.topH;
  const splitPx = Math.round(PACK_H*TEAR_AT);
  const bodyCanvas = cropCanvas(art, 0, splitPx);
  const topCanvas  = cropCanvas(art, splitPx, PACK_H-splitPx);
  const backBody   = cropCanvas(backArt, 0, splitPx);
  const backTop    = cropCanvas(backArt, splitPx, PACK_H-splitPx);

  function mat(canvas){
    const t=new THREE.CanvasTexture(canvas);
    t.minFilter=THREE.LinearFilter; t.generateMipmaps=false;
    return new THREE.MeshPhongMaterial({map:t, shininess:78, specular:0x8899bb});
  }
  const foil = new THREE.MeshPhongMaterial({color:0x9fb7d8, shininess:110, specular:0xffffff});
  const inside = new THREE.MeshPhongMaterial({color:0x2b2f45, shininess:10});

  packGroup = new THREE.Group();

  // The +Y face is left undrawn: the wrapper is open at the top once torn, and
  // a solid lid would be sliced through by every card on its way out. The
  // camera sits below the rim so nothing shows through the opening.
  const openTop = new THREE.MeshBasicMaterial();
  openTop.visible = false;
  const bodyGeo = new THREE.BoxGeometry(PACK.w, bodyH, PACK.d);
  packBody = new THREE.Mesh(bodyGeo, [foil,foil,openTop,foil, mat(bodyCanvas), mat(backBody)]);
  packBody.position.y = -PACK.topH/2;
  packGroup.add(packBody);

  // Jagged torn edge. The teeth sit just proud of the box they belong to —
  // a hair thinner in depth and with only a sliver of overlap — so their
  // faces are never coplanar with the wrapper's, which would z-fight.
  const teeth = 13, amp = 0.055, jagD = 0.012;
  function zig(up){
    const s = new THREE.Shape();
    const w = PACK.w, base = up ? -0.006 : 0.006;
    s.moveTo(-w/2, base);
    s.lineTo(-w/2, 0);
    for(let i=0;i<teeth;i++){
      const x1=-w/2+((i+0.5)/teeth)*w, x2=-w/2+((i+1)/teeth)*w;
      s.lineTo(x1, up?amp:-amp); s.lineTo(x2, 0);
    }
    s.lineTo(w/2, base);
    s.closePath();
    const g = new THREE.ExtrudeGeometry(s,{depth:jagD, bevelEnabled:false});
    g.translate(0,0,-jagD/2);
    return g;
  }
  // A pack is two sheets of foil. Extruding the teeth through the whole depth
  // made a solid block across the opening that every card cut through; two thin
  // strips at the front and back faces let the cards pass between them.
  function makeJag(up){
    const g = new THREE.Group();
    const front = new THREE.Mesh(zig(up), foil);
    front.position.z =  PACK.d/2 - jagD/2;
    const back  = new THREE.Mesh(zig(up), foil);
    back.position.z  = -PACK.d/2 + jagD/2;
    g.add(front); g.add(back);
    return g;
  }
  const tearY = bodyH - PACK.h/2;
  packBodyJag = makeJag(true);
  packBodyJag.position.y = tearY;
  packBodyJag.visible = false;   // sealed pack shows no torn edge yet
  packGroup.add(packBodyJag);

  // The flap hinges on its REAR edge, not on the centre of the tear line.
  // Hinging at z=0 swings the flap's whole rear half down into the pack body
  // as it peels — 0.137 of penetration at full rotation.
  packTopPivot = new THREE.Group();
  packTopPivot.position.set(0, tearY, TOP_PIVOT_Z);
  const topGeo = new THREE.BoxGeometry(PACK.w, PACK.topH, PACK.d);
  const topMesh = new THREE.Mesh(topGeo, [foil,foil,foil,inside, mat(topCanvas), mat(backTop)]);
  topMesh.position.set(0, PACK.topH/2, PACK.d/2);
  packTopPivot.add(topMesh);
  packTopJag = makeJag(false);
  packTopJag.position.z = PACK.d/2;
  packTopJag.visible = false;
  packTopPivot.add(packTopJag);
  packGroup.add(packTopPivot);

  packGroup.position.y = 0.05;
  scene.add(packGroup);
}

/* ============================================================
   10. Tween helper
   ============================================================ */
const tweens=[];
function tween(dur, onUpdate, ease, onEnd, delay){
  const tw={t:-(delay||0), dur, onUpdate, ease:ease||easeInOut, onEnd, done:false};
  tweens.push(tw); return tw;
}
function stepTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    if(tw.t<0) continue;
    const k=clamp(tw.t/tw.dur,0,1);
    tw.onUpdate(tw.ease(k), k);
    if(k>=1){ tweens.splice(i,1); if(tw.onEnd) tw.onEnd(); }
  }
}

   11. Game state
   ============================================================ */
const UI = {

  grid: document.getElementById("grid"),
  sumLede: document.getElementById("sumLede"),
  binder: document.getElementById("binder"),
  binderGrid: document.getElementById("binderGrid"),
  binderFilters: document.getElementById("binderFilters"),
  binderStats: document.getElementById("binderStats"),
  binderDetail: document.getElementById("binderDetail"),
  binderStage: document.getElementById("binderStage"),
  binderMeta: document.getElementById("binderMeta"),
  binderActions: document.getElementById("binderActions"),

  binderClose: document.getElementById("binderClose"),
  binderFromSummary: document.getElementById("binderFromSummary"),
  again: document.getElementById("again"),
  sound: document.getElementById("sound")
};

let state = "idle";       // idle | tearing | dealing | viewing | done
let cards = [];
let index = 0;
let tearProgress = 0;
let packsOpened = 0;

function setHint(html){ UI.hint.innerHTML = html; }

function buildPips(){
  UI.pips.innerHTML="";
  cards.forEach(()=>{ const d=document.createElement("div"); d.className="pip"; UI.pips.appendChild(d); });
}
function updatePips(){
  const nodes = UI.pips.children;
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i]; n.className="pip";
    if(cards[i].revealed){ n.classList.add(cards[i].holo!=="none" ? "hit":"done"); }
    if(i===index && state==="viewing") n.classList.add("now");
  }
}

/* ---------- start a new pack ---------- */
function newPack(){
  // clear old
  cards.forEach(c=>{ if(c.pivot) scene.remove(c.pivot); });
  cards = generatePack();
  index=0; tearProgress=0; tweens.length=0;
  if(packGroup){ scene.remove(packGroup); packGroup=null; }
  buildPackMeshes();
  packGroup.scale.setScalar(0.001);
  tween(0.65, k=>{ packGroup.scale.setScalar(lerp(0.001,1,k)); }, back);
  state="idle";
  UI.summary.classList.remove("on");
  UI.pips.innerHTML="";
  UI.meter.style.opacity="0";
  UI.action.style.display="none";
  setHint("Drag sideways across the <b>tear strip</b> at the top of the pack");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    if(state==="idle" && tearProgress===0) UI.action.style.display="block";
  }, 7000);
}
let idleTimer = null;

/* ---------- tearing ---------- */
function applyTear(){
  const p = easeOut(tearProgress);
  packTopPivot.rotation.x = -p*1.15;
  packTopPivot.position.z = TOP_PIVOT_Z + p*0.06;
  if(packBodyJag) packBodyJag.visible = tearProgress > 0.02;
  if(packTopJag)  packTopJag.visible  = tearProgress > 0.02;
  UI.meterFill.style.width = (tearProgress*100)+"%";
}

function finishTear(){
  state="dealing";
  UI.meter.style.opacity="0";
  Audio2.bigRip();
  if(navigator.vibrate) navigator.vibrate([18,30,40]);
  setHint("");

  // whatever angle the float left behind, drive it to zero before cards show
  const r0x = packGroup.rotation.x, r0y = packGroup.rotation.y;
  tween(0.3, k=>{
    packGroup.rotation.x = lerp(r0x, 0, k);
    packGroup.rotation.y = lerp(r0y, 0, k);
  }, easeOut);

  const startRot = packTopPivot.rotation.x;
  tween(0.45, k=>{
    packTopPivot.rotation.x = startRot - k*2.2;
    packTopPivot.position.y = lerp(PACK.h-PACK.topH-PACK.h/2, PACK.h*1.25, k);
    packTopPivot.position.x = k*2.2;
    packTopPivot.rotation.z = k*1.6;
    packTopPivot.scale.setScalar(1-k*0.3);
  }, easeOut, ()=>{ packTopPivot.visible=false; });

  dealCards();

  // The wrapper is pulled down first. That gives the cards real upward
  // travel out of the opening instead of hopping up and falling back into
  // the same spot the pack was already occupying.
  tween(0.34, k=>{
    packGroup.position.y = lerp(0.05, PACK_DROP_Y, k);
    packBody.scale.set(1, 1-k*0.03, 1);
  }, easeInOut);
  tween(0.55, k=>{
    packGroup.position.y = PACK_DROP_Y - k*4.9;
    packGroup.scale.setScalar(lerp(1,0.94,k));
  }, easeInOut, ()=>{ scene.remove(packGroup); packGroup=null; }, 0.80);
}

/* ---------- dealing ---------- */
// The active card sits on the fitted plane at z=0. Everything still waiting
// sits far enough back that a full tilt or flip can never sweep into it:
// half the card diagonal at max rotation is ~0.65, so the deck starts at -1.1.
// Where the wrapper is pulled down to before the cards are drawn out, and
// the spot inside it where the cards wait. A full-size card (1.72 x 2.405)
// now clears the opened interior (1.90 x 2.55) on every side, so the cards
// need no shrinking to stay concealed.
const PACK_DROP_Y = -0.85;
const CARD_HIDDEN_Y = PACK_DROP_Y - 0.15;

// World-space room between the top of a settled card and the top of frame.
// Depends on the camera fit, so it shrinks on wide viewports instead of
// throwing cards past the edge.
function headroom(){
  const halfVisible = camera.position.z * Math.tan((camera.fov*Math.PI/180)/2);
  return Math.max(0.18, halfVisible - CARD_MESH_H/2 - 0.08);
}

function stackPos(i){
  const off = i - index;
  if(off <= 0) return {x:0, y:0, z:0};
  return { x:0, y:-0.014*off, z:-1.1 - 0.032*off };
}

function dealCards(){
  if(!cards.length){ cards = generatePack(); }

  // Cards wait at full size inside the lowered wrapper, stacked through its
  // depth so none of them intersect each other, and all of them sit behind
  // its front face — that occlusion is what reads as "inside the pack".
  cards.forEach((card,i)=>{
    const pivot = makeCardMesh(card);
    card.revealed=false; card.flipped=false;
    card.tiltSeed = (Math.random()-0.5);
    card.startZ = 0.077 - i*0.017;
    pivot.position.set(0, CARD_HIDDEN_Y, card.startZ);
    pivot.rotation.set(0, Math.PI, 0);
    pivot.scale.setScalar(1);
    pivot.visible = false;
    scene.add(pivot);
  });
  buildPips();

  const n = cards.length;
  const bump = Math.min(0.12, headroom()*0.4);

  cards.forEach((card,i)=>{
    const to = stackPos(i);
    tween(0.7, k=>{
      card.pivot.visible = true;
      const e = easeOut(k);
      // A straight vertical slide. No arc, no sway, no tumble: a card being
      // drawn out of a wrapper doesn't swing sideways, and any roll while it
      // still overlaps the pack throws its corners outside the wrapper.
      card.pivot.position.x = 0;
      card.pivot.position.y = lerp(CARD_HIDDEN_Y, to.y, e) + Math.sin(k*Math.PI)*bump;
      // depth is held until the wrapper has fallen away — see the settle tween
      // below. Moving back toward the deck during the rise drove the card out
      // through the rear face of the pack.
      card.pivot.position.z = card.startZ;
      card.pivot.rotation.x = 0;
      card.pivot.rotation.y = Math.PI;
      // a whisper of roll, only once it is fully clear of the wrapper
      card.pivot.rotation.z = Math.sin(clamp((k-0.72)/0.28,0,1)*Math.PI) * card.tiltSeed * 0.05;
      card.pivot.scale.setScalar(1);
    }, easeInOut, null, 0.50 + (n-1-i)*0.03);

    // The card's resting height is below the wrapper's rim, so it never rises
    // clear of the pack — the pack drops away instead. Only once it has can a
    // card move back to its deck depth without cutting through the foil.
    tween(0.45, k=>{
      card.pivot.position.z = lerp(card.startZ, to.z, k);
    }, easeInOut, ()=>{
      if(i===0){
        card.pivot.rotation.z = 0;
        state="viewing"; index=0; updatePips();
        setHint("<b>Tap the card</b> to flip it");
      }
    }, 1.05);
  });

  cards.forEach((c,i)=>{ c.pivot.renderOrder = n-i; });
  Audio2.whoosh();
}

/* ---------- flip / advance ---------- */
let tilt = {x:0,y:0,tx:0,ty:0};
// Counter-rotation applied to device tilt, in radians at full sweep.
const FLOAT_TILT = 0.46, FLOAT_SHIFT = 0.085;

/* ============================================================
   Binder — what you have pulled, kept in localStorage
   ============================================================ */
// Every read and write is guarded: localStorage throws outright in Safari's
// private mode and can be disabled entirely. The binder degrades to
// in-memory-only rather than taking the app down with it.
const Binder = (function(){
  const KEY = "kanto.binder.v1";
  const RANK = {none:0, reverse:1, rare:2};
  let data = {v:1, packs:0, pulls:0, cards:{}};
  let usable = true;

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && d.v === 1 && d.cards) data = d;
      }
    } catch(e){
      usable = false;
      console.warn("[binder] storage unavailable, collection won't persist:", e && e.message);
    }
  }
  let saveQueued = false;
  function save(){
    // Pulls arrive in bursts as a pack is flipped through; write once per tick.
    if(!usable || saveQueued) return;
    saveQueued = true;
    setTimeout(()=>{
      saveQueued = false;
      try { localStorage.setItem(KEY, JSON.stringify(data)); }
      catch(e){ usable = false; console.warn("[binder] save failed:", e && e.message); }
    }, 0);
  }

  load();
  return {
    // One pulled card. `finish` is "none" | "reverse" | "rare"; a slot keeps
    // the best finish ever pulled for it, so a later plain copy can't
    // downgrade a holo you already own.
    record(mon, finish){
      const id = NUMBERS[mon.name];
      if(!id) return;
      const c = data.cards[String(id)] || {n:0, best:"none", first:0};
      c.n++;
      // Tally each finish, not just the best one, so duplicates can say what
      // they are rather than only how many. Records written before this
      // existed are backfilled on read.
      if(!c.f) c.f = {};
      c.f[finish] = (c.f[finish] || 0) + 1;
      if(RANK[finish] > RANK[c.best]) c.best = finish;
      if(!c.first) c.first = Date.now();
      data.cards[String(id)] = c;
      data.pulls++;
      save();
    },
    countPack(){ data.packs++; save(); },
    get(id){
      const c = data.cards[String(id)];
      if(!c) return null;
      // Older records only knew the count and the best finish. Attribute them
      // all to that finish: it is the only reading the data supports.
      if(!c.f) c.f = {[c.best]: c.n};
      return c;
    },
    stats(){
      const owned = Object.keys(data.cards).length;
      let holo = 0, rev = 0, dupes = 0, spare = 0;
      for(const k in data.cards){
        const c = data.cards[k];
        if(c.best === "rare") holo++;
        else if(c.best === "reverse") rev++;
        if(c.n > 1){ dupes++; spare += c.n - 1; }
      }
      return {owned, total:DEX_ORDER.length, packs:data.packs, pulls:data.pulls,
              holo, rev, dupes, spare, usable};
    }
  };
})();

// Frame 0 of a sprite sheet as a CSS background, so 151 thumbnails cost no
// canvases: size the element to one cell and let background-size scale the
// whole sheet around it.
function spriteThumbStyle(id, box){
  const e = window.SPRITE_DATA && window.SPRITE_DATA[id];
  if(!e) return null;
  const fw = e.fw || 0, fh = e.fh || 0;
  if(typeof e === "string" || !fw) return {src:(e.src||e), plain:true};
  const k = Math.min(box/fw, box/fh);
  const rows = Math.ceil(e.n / e.cols);
  return {
    w: Math.round(fw*k), h: Math.round(fh*k),
    bg: `url(${e.src})`,
    size: `${Math.round(e.cols*fw*k)}px ${Math.round(rows*fh*k)}px`
  };
}

let binderFilter = "all";
const FINISH_LABEL = {none:"Normal", reverse:"Reverse holo", rare:"Holo"};

function renderBinder(){
  const grid = UI.binderGrid;
  const st = Binder.stats();
  // Counts on the chips, so it is obvious whether a filter has anything in it
  // before you tap it.
  const counts = {all: st.total, owned: st.owned, dupes: st.dupes, holo: st.holo + st.rev};
  UI.binderFilters.querySelectorAll(".chip").forEach(ch=>{
    const f = ch.dataset.filter;
    ch.classList.toggle("on", f === binderFilter);
    let c = ch.querySelector(".c");
    if(!c){ c = document.createElement("span"); c.className="c"; ch.appendChild(c); }
    c.textContent = counts[f];
  });
  const pct = Math.round(st.owned/st.total*100);
  UI.binderStats.innerHTML =
    `<b style="color:var(--paper)">${st.owned}/${st.total}</b> collected · ${pct}% · ` +
    `${st.packs} pack${st.packs===1?"":"s"} opened · ${st.pulls} card${st.pulls===1?"":"s"} pulled` +
    (st.holo ? ` · ${st.holo} holo` : "") +
    (st.usable ? "" : `<br><span style="color:#ffb4a1">Storage is unavailable, so this won't be saved.</span>`);

  const frag = document.createDocumentFragment();
  let shown = 0;
  DEX_ORDER.forEach((name, i)=>{
    const id = i+1;
    const have = Binder.get(id);
    if(binderFilter === "owned" && !have) return;
    if(binderFilter === "dupes" && !(have && have.n > 1)) return;
    if(binderFilter === "holo" && !(have && have.best !== "none")) return;
    shown++;
    const slot = document.createElement("div");
    slot.className = "slot " + (have ? "own" : "miss")
      + (have && have.best==="rare" ? " holo" : have && have.best==="reverse" ? " rev" : "");
    const no = document.createElement("span");
    no.className = "no"; no.textContent = String(id).padStart(3,"0");
    slot.appendChild(no);

    const art = document.createElement("div");
    art.className = "art";
    const t = spriteThumbStyle(id, 46);
    if(t && !t.plain){
      art.style.width = t.w+"px"; art.style.height = t.h+"px";
      art.style.backgroundImage = t.bg; art.style.backgroundSize = t.size;
      art.style.backgroundPosition = "0 0";
    } else if(t && t.plain){
      art.style.width = art.style.height = "46px";
      art.style.backgroundImage = `url(${t.src})`;
      art.style.backgroundSize = "contain";
    }
    slot.appendChild(art);

    if(have){
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = name;
      slot.appendChild(nm);
      if(have.n > 1){
        const d = document.createElement("span");
        d.className = "dup"; d.textContent = "x"+have.n;
        slot.appendChild(d);
      }
      slot.addEventListener("click", ()=>{ Audio2.tap(); showBinderDetail(id, name, have); });
    }
    frag.appendChild(slot);
  });
  grid.innerHTML = "";
  if(!shown){
    const empty = document.createElement("div");
    empty.id = "binderEmpty";
    empty.textContent = binderFilter === "dupes"
      ? "No duplicates yet. Pull the same Pokémon twice and it will show up here."
      : binderFilter === "holo"
        ? "No holos yet. Every pack has a reverse holo, and about one in three has a holo rare."
        : "Nothing here yet.";
    grid.appendChild(empty);
  }
  grid.appendChild(frag);
}

// A real card, not a picture of one. The holo is a shader on the card's own
// material, so a flat canvas render of a holo pull looked exactly like a normal
// one -- there was no way to actually see what you had pulled. This builds the
// same mesh the pack uses, in its own small renderer, and lets you tilt it.
let binderView = null;
function closeBinderCard(){
  if(!binderView) return;
  cancelAnimationFrame(binderView.raf);
  const { renderer, pivot, card } = binderView;
  pivot.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  // Only what this view made. The back material, its texture and the room map
  // are shared with the pack and must outlive this.
  if(card.frontMat){
    const u = card.frontMat.uniforms;
    if(u.uMap.value) u.uMap.value.dispose();
    if(u.uMask.value) u.uMask.value.dispose();
    card.frontMat.dispose();
  }
  if(card.spriteTex) card.spriteTex.dispose();
  if(binderView.edgeMat) binderView.edgeMat.dispose();
  renderer.dispose();
  if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  binderView = null;
}

function openBinderCard(mon, finish){
  closeBinderCard();
  const host = UI.binderStage;
  host.innerHTML = "";
  const w = host.clientWidth || 340, h = host.clientHeight || 460;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(2.5,4,5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff7fd0, 0.45); rim.position.set(-3,-1,2); scene.add(rim);

  const camera = new THREE.PerspectiveCamera(36, w/h, 0.1, 100);
  camera.position.z = CARD_MESH_H * 1.42;

  const card = {mon, stats: statsFor(mon), holo: finish};
  const pivot = makeCardMesh(card);
  scene.add(pivot);
  card.frontMat.uniforms.uHolo.value = finish === "none" ? 0 : 1;

  const view = {renderer, scene, camera, pivot, card, raf:0,
                edgeMat: card.mesh && card.mesh.material && card.mesh.material[2],
                tx:0, ty:0, cx:0, cy:0, drag:false};
  binderView = view;

  const set = (px,py)=>{
    const r = host.getBoundingClientRect();
    view.ty = ((px - r.left)/r.width  - 0.5) *  1.15;
    view.tx = ((py - r.top )/r.height - 0.5) *  0.85;
  };
  host.addEventListener("pointerdown", e=>{ view.drag=true; host.setPointerCapture(e.pointerId); set(e.clientX,e.clientY); });
  host.addEventListener("pointermove", e=>{ if(view.drag) set(e.clientX,e.clientY); });
  host.addEventListener("pointerup",   ()=>{ view.drag=false; });
  host.addEventListener("pointercancel",()=>{ view.drag=false; });

  const clock = new THREE.Clock();
  (function tick(){
    view.raf = requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    // Drifts on its own when untouched, so a holo shows what it is without
    // the viewer having to know to drag it.
    const idleY = view.drag ? 0 : Math.sin(t*0.7)*0.30;
    const idleX = view.drag ? 0 : Math.sin(t*0.52)*0.10;
    view.cx = lerp(view.cx, view.tx + idleX, 0.10);
    view.cy = lerp(view.cy, view.ty + idleY, 0.10);
    pivot.rotation.y = view.cy;
    pivot.rotation.x = view.cx;
    card.frontMat.uniforms.uTime.value = t;
    card.frontMat.uniforms.uTilt.value.set(view.cy*1.5, view.cx*1.5);
    stepCardArt(card, t);
    renderer.render(scene, camera);
  })();
}

function flipCurrent(){
  const card = cards[index];
  if(!card || card.flipped) return;
  card.flipped=true;
  Audio2.flip();
  if(navigator.vibrate) navigator.vibrate(12);
  let celebrated=false;
  tween(0.62, (k)=>{
    card.pivot.rotation.y = lerp(Math.PI, 0, k);
    card.pivot.position.z = Math.sin(k*Math.PI)*0.5;
    card.pivot.scale.setScalar(1 + Math.sin(k*Math.PI)*0.07);
    card.frontMat.uniforms.uHolo.value = card.holo==="none" ? 0 : clamp((k-0.45)/0.45,0,1);
    if(!celebrated && k>0.55 && card.holo!=="none"){ celebrated=true; celebrate(card); }
  }, easeInOut, ()=>{
    card.revealed=true;
    Binder.record(card.mon, card.holo);
    card.frontMat.uniforms.uHolo.value = card.holo==="none"?0:1;
    Motion.recentre();
    updatePips();
    setHint(index===cards.length-1
      ? "<b>Drag to tilt</b> · tap to see your pull"
      : "<b>Drag to tilt</b> · tap for the next card");
  });
  updatePips();
}

function celebrate(card){
  const rare = card.holo==="rare";
  FX.burst(rare?"rare":"reverse");
  Audio2.holo(card.holo);
  if(navigator.vibrate) navigator.vibrate(rare?[30,40,30,40,80]:[20,40,40]);
  UI.bannerBig.textContent = rare ? "HOLO RARE" : "REVERSE HOLO";
  UI.bannerSub.textContent = card.mon.name.toUpperCase();
  UI.banner.classList.add("on");
  setTimeout(()=>UI.banner.classList.remove("on"), rare?2100:1500);
}

function nextCard(){
  const card = cards[index];
  if(!card) return;
  Audio2.whoosh();
  tilt.tx=0; tilt.ty=0;
  const c = card;
  const dir = (index%2)?-1:1;
  tween(0.5, k=>{
    c.pivot.position.x = k*dir*4.5;
    c.pivot.position.y = k*0.6;
    c.pivot.rotation.z = k*dir*0.9;
    c.pivot.rotation.y = k*dir*0.7;
    c.pivot.scale.setScalar(1-k*0.25);
  }, easeInOut, ()=>{ c.pivot.visible=false; });

  if(index>=cards.length-1){
    state="done";
    setTimeout(showSummary, 420);
    return;
  }
  index++;
  updatePips();
  setHint("<b>Tap the card</b> to flip it");
  // bring the rest of the stack forward
  for(let i=index;i<cards.length;i++){
    const c2 = cards[i], target = stackPos(i);
    const from = {x:c2.pivot.position.x,y:c2.pivot.position.y,z:c2.pivot.position.z,s:c2.pivot.scale.x};
    tween(0.4, k=>{
      c2.pivot.position.x = lerp(from.x,target.x,k);
      c2.pivot.position.y = lerp(from.y,target.y,k);
      c2.pivot.position.z = lerp(from.z,target.z,k);
      c2.pivot.scale.setScalar(lerp(from.s, 1, k));
    }, easeOut);
  }
}

// The card face plus its sprite, on one canvas, for anywhere a still image of
// the card is needed rather than the live mesh.
let flatScratch = null;
function flattenCardFace(card){
  if(!flatScratch){
    flatScratch = document.createElement("canvas");
    flatScratch.width = CARD_W; flatScratch.height = CARD_H;
  }
  const x = flatScratch.getContext("2d");
  x.clearRect(0,0,CARD_W,CARD_H);
  x.drawImage(card.frontCanvas, 0, 0);
  if(card.art) x.drawImage(card.art.canvas, card.art.x, card.art.y);
  return flatScratch;
}

function renderSummary(){
  UI.grid.innerHTML="";
  let holos=0, reverses=0;
  cards.forEach(card=>{
    const d=document.createElement("div");
    d.className="thumb"+(card.holo==="rare"?" hit":card.holo==="reverse"?" rev":"");
    const img=document.createElement("img");
    img.alt = card.mon.name;
    try {
      // The card face no longer holds the sprite -- it lives on its own quad in
      // front of the card -- so a thumbnail taken straight from frontCanvas
      // comes out as an empty habitat scene. Composite the two here.
      img.src = flattenCardFace(card).toDataURL("image/png");
      d.appendChild(img);
    } catch(e){
      // a cross-origin image tainted the canvas; show the name instead
      const label=document.createElement("div");
      label.style.cssText="display:grid;place-items:center;height:100%;font-size:11px;font-weight:700;padding:6px;text-align:center";
      label.textContent = card.mon.name;
      d.appendChild(label);
    }

    }

  UI.sumLede.textContent = holos
    ? `${rare.mon.name} came out holo. That is roughly a one-in-three pack.`
    : `Your rare this pack is ${rare.mon.name}. ${reverses?"The reverse holo is "+cards.find(c=>c.holo==="reverse").mon.name+".":""}`;
  UI.summary.classList.add("on");
  setHint("");
}

/* ============================================================
   12. Input
   ============================================================ */
let pointer = {down:false, x0:0, y0:0, x:0, y:0, moved:0, t0:0, target:null};

function localPoint(e){
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX, y:t.clientY};
}

function onDown(e){
  Audio2.unlock();
  const p = localPoint(e);
  pointer.down=true; pointer.x0=p.x; pointer.y0=p.y; pointer.x=p.x; pointer.y=p.y;
  pointer.moved=0; pointer.t0=performance.now();

  if(state==="idle"){
    // is the touch near the top of the pack?
    pointer.target = "pack";
    UI.meter.style.opacity="1";
    UI.action.style.display="none";
    clearTimeout(idleTimer);
  } else if(state==="viewing"){
    pointer.target = "card";
  } else pointer.target=null;
}

function onMove(e){
  if(!pointer.down) return;
  const p = localPoint(e);
  const dx = p.x-pointer.x, dy = p.y-pointer.y;
  pointer.moved += Math.abs(dx)+Math.abs(dy);
  pointer.x=p.x; pointer.y=p.y;

  if(pointer.target==="pack" && state==="idle"){
    const before = tearProgress;
    tearProgress = clamp(tearProgress + Math.abs(dx)/(window.innerWidth*0.62), 0, 1);
    applyTear();
    if(Math.floor(before*14)!==Math.floor(tearProgress*14)){
      Audio2.rip(0.6+tearProgress*0.8);
      if(navigator.vibrate) navigator.vibrate(6);
    }
    if(tearProgress>=1){ pointer.down=false; finishTear(); }
  }
  else if(pointer.target==="card" && state==="viewing"){
    const card = cards[index];
    if(card && card.flipped){
      tilt.ty = clamp((pointer.x-pointer.x0)/window.innerWidth*1.6, -0.55, 0.55);
      tilt.tx = clamp((pointer.y-pointer.y0)/window.innerHeight*1.1, -0.4, 0.4);
    } else {
      // small peek wobble before the flip
      tilt.ty = clamp((pointer.x-pointer.x0)/window.innerWidth*0.7, -0.25, 0.25);
    }
  }
}

function onUp(){
  if(!pointer.down) return;
  const tapped = pointer.moved < 14 && (performance.now()-pointer.t0) < 400;
  pointer.down=false;
  tilt.tx=0; tilt.ty=0;

  if(state==="idle"){
    UI.meter.style.opacity = tearProgress>0 ? "1" : "0";
    if(tearProgress>0 && tearProgress<1){
      // spring back a little if they let go early
      const from = tearProgress;
      tween(0.35, k=>{ tearProgress = lerp(from, from*0.55, k); applyTear(); }, easeOut);
      setHint("Keep dragging — the strip is almost off");
    } else if(tapped){
      setHint("Drag <b>sideways</b> across the tear strip at the top");
    }
  } else if(state==="viewing" && tapped){
    const card = cards[index];
    if(!card) return;
    if(!card.flipped) flipCurrent();
    else if(card.revealed) nextCard();
  }
}

const Motion = (function(){
  let enabled=false, receiving=false, base=null;
  let tx=0, ty=0, cx=0, cy=0;
  const RANGE = 32;   // degrees of tilt for the full sweep

  function screenAngle(){
    if(window.screen && screen.orientation && typeof screen.orientation.angle === "number")
      return screen.orientation.angle;
    return window.orientation || 0;
  }
  function onOrient(e){
    if(e.beta == null || e.gamma == null) return;
    receiving = true;
    const a = screenAngle()*Math.PI/180;
    const g =  e.gamma*Math.cos(a) + e.beta*Math.sin(a);
    const b =  e.beta *Math.cos(a) - e.gamma*Math.sin(a);
    if(!base) base = {b:b, g:g};
    ty = clamp((g-base.g)/RANGE, -1, 1);
    tx = clamp((b-base.b)/RANGE, -1, 1);
  }
  return {
    supported(){ return typeof DeviceOrientationEvent !== "undefined"; },
    needsPermission(){
      return typeof DeviceOrientationEvent !== "undefined" &&
             typeof DeviceOrientationEvent.requestPermission === "function";
    },
    isOn(){ return enabled; },
    isReceiving(){ return receiving; },
    recentre(){ base = null; },
    enable(){
      const attach = ()=>{
        window.addEventListener("deviceorientation", onOrient, true);
        enabled = true; base = null;
        return true;
      };
      if(this.needsPermission()){
        // iOS only grants this from inside a user gesture
        return DeviceOrientationEvent.requestPermission()
          .then(r => r === "granted" ? attach() : false)
          .catch(()=> false);
      }
      return Promise.resolve(attach());
    },
    disable(){
      window.removeEventListener("deviceorientation", onOrient, true);
      enabled=false; tx=0; ty=0;
    },
    step(){
      cx = lerp(cx, enabled?tx:0, 0.12);
      cy = lerp(cy, enabled?ty:0, 0.12);
      return {x:cx, y:cy};
    }
  };
})();

const tiltBtn = document.getElementById("tiltbtn");
function paintTiltBtn(){
  if(!tiltBtn) return;

if(tiltBtn && Motion.supported()){
  tiltBtn.hidden = false;
  tiltBtn.addEventListener("click", ()=>{

    if(Motion.isOn()){
      Motion.disable(); paintTiltBtn();
      setHint("Tilt shine off — drag a card to move the shine");
    } else {
      Promise.resolve(Motion.enable()).then(ok=>{
        paintTiltBtn();
        setHint(ok ? "Tilt the phone to move the shine"
                   : "This browser wouldn't allow motion access");
      });
    }
  });
  // Android and desktop sensors need no prompt, so turn it on quietly and
  // hide the button again if nothing ever arrives.
  if(!Motion.needsPermission()){
    Promise.resolve(Motion.enable()).then(()=>{
      paintTiltBtn();
      setTimeout(()=>{
        if(!Motion.isReceiving()){ Motion.disable(); tiltBtn.hidden = true; }
        paintTiltBtn();
      }, 2500);
    });
  }
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  stepTweens(dt);

  if(packGroup && state==="idle"){
    if(tearProgress === 0){
      packGroup.rotation.y = Math.sin(t*0.6)*0.22;
      packGroup.rotation.x = Math.sin(t*0.45)*0.08;
      packGroup.position.y = 0.05 + Math.sin(t*1.1)*0.035;
    } else {
      // Once tearing starts the wrapper must settle square on. Rotated even a
      // few degrees, its front face sweeps back behind the cards waiting
      // inside and they show through the foil.
      packGroup.rotation.y = lerp(packGroup.rotation.y, 0, 0.2);
      packGroup.rotation.x = lerp(packGroup.rotation.x, 0, 0.2);
      packGroup.position.y = lerp(packGroup.position.y, 0.05, 0.2);
    }
  }

  tilt.x = lerp(tilt.x, tilt.tx, 0.16);
  tilt.y = lerp(tilt.y, tilt.ty, 0.16);
  const mo = Motion.step();

  const shadow = cardShadow || ensureCardShadow();
  let shadowOn = false;
  cards.forEach((card,i)=>{
    if(!card.pivot || !card.pivot.visible) return;
    if(i===index && state==="viewing"){
      // Sit behind and below the card, drifting with the tilt so the card
      // reads as lifted off the background rather than pasted to it.
      const p = card.pivot.position, sc = card.pivot.scale.x;
      shadow.position.set(p.x + 0.06 + tilt.y*0.12, p.y - 0.12 - Math.abs(tilt.x)*0.05, p.z - 0.60);
      // Far enough back that perspective shrinks it, so scale up to compensate.
      shadow.scale.setScalar(sc * 1.10);
      shadow.material.opacity = 0.9*sc;
      shadowOn = true;
    }
    // Only the focused card shows its front; the rest of the stack sits behind
    // it face-down. Stepping all ten would re-upload ten card textures a frame
    // for art nobody can see.
    if(i===index) stepCardArt(card, t);
    card.frontMat.uniforms.uTime.value = t;
    // a few degrees of wrist movement sweeps the whole pattern while the card
    // itself barely moves, which is how a real foil card behaves
    // dragging up leans the top edge away from you, as if pushing the far
    // edge back — the inverse reads as the card falling toward you
    // Device tilt is applied inverted. Turning the phone used to turn the card
    // with it, which reads as the card being stuck to the screen. Countering
    // the rotation instead holds the card still in the world while the phone
    // moves around it, so it reads as floating in place.
    card.frontMat.uniforms.uTilt.value.set(-mo.y*1.7, -mo.x*1.7);
    if(i===index && state==="viewing" && card.revealed){
      // FLOAT_TILT is in radians at full sweep, matched to Motion's own RANGE
      // (32 degrees = 0.56 rad) so the counter-rotation tracks the device close
      // to one-to-one. Slightly under, which keeps it stable rather than
      // feeling like the card is fighting you.
      card.pivot.rotation.y = tilt.y - mo.y*FLOAT_TILT;
      card.pivot.rotation.x = tilt.x - mo.x*FLOAT_TILT;
      // A little counter-translation as well: a fixed object seen from a
      // moving viewpoint shifts as well as turns, and without it the card
      // reads as pivoting on a pin.
      card.pivot.position.x = -mo.y*FLOAT_SHIFT;
      card.pivot.position.y =  mo.x*FLOAT_SHIFT;
    } else if(i===index && state==="viewing" && !card.flipped){
      card.pivot.rotation.y = Math.PI + tilt.y + Math.sin(t*0.9)*0.03;
      card.pivot.rotation.x = Math.sin(t*0.7)*0.02;
    }
  });

  shadow.visible = shadowOn;
  renderer.render(scene,camera);
}
animate();
// Show a pack straight away using the built-in fallback art. The 151 remote
// sprites then load in the background, and the pack is rebuilt with the real
// art once they arrive — as long as it hasn't been torn open yet.
// Test hook: render the art window for named Pokemon without opening packs.
window.__back = function(){ return buildCardBack().toDataURL("image/png"); };
window.__sheet = function(names){
  return names.map(n=>{
    const mon = MON_BY_NAME[n];
    if(!mon) return null;
    const f = buildCardFace({mon, stats:statsFor(mon), holo:"none"}, {flatSprite:true});
    const c = document.createElement("canvas"); c.width=428; c.height=286;
    c.getContext("2d").drawImage(f.front, 42,136,428,286, 0,0,428,286);
    return c.toDataURL("image/png");
  }).filter(Boolean);
};
newPack();
// The sprite bundle is big, so it is pulled in after the pack is already
// interactive rather than blocking the page on it. --inline puts the data in
// the document directly, in which case there is nothing to fetch.
function loadSpriteData(){
  if(window.SPRITE_DATA) return Promise.resolve(true);
  return new Promise(resolve=>{
    const sc = document.createElement("script");
    sc.src = SPRITE_DATA_URL;
    sc.onload  = ()=>resolve(Boolean(window.SPRITE_DATA));
    sc.onerror = ()=>resolve(false);
    document.head.appendChild(sc);
  });
}
loadSpriteData()
  .then(ok=>{
    if(!ok) console.warn(`[art] ${SPRITE_DATA_URL} unavailable — falling back to the sprite CDNs.`);
    return preloadSpriteImages();
  })
  .then(()=>{ if(state==="idle" && tearProgress===0) newPack(); })
  .catch(err=>{ console.error(err); });

};
</script>

<script>
(function(){
  var SOURCES = [
    // Vendored copy first: no network, and it keeps working offline.
    "three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "https://unpkg.com/three@0.128.0/build/three.min.js"
  ];
  var sourceIndex=0, loading=false, started=false;
  var bar=document.getElementById("bootProgress");
  var pct=document.getElementById("bootPercent");
  var status=document.getElementById("bootStatus");
  function progress(n,text){
    if(bar) bar.style.width=n+"%";
    if(pct) pct.textContent=Math.round(n)+"%";
    if(status && text) status.textContent=text;
  }
  function startApp(){
    if(started || !window.THREE || typeof window.bootPackOpener!=="function") return false;
    started=true;
    progress(100,"3D engine loaded. Starting pack opener…");
    try {
      window.bootPackOpener();
      var b=document.getElementById("boot");
      if(b) b.remove();
    } catch(e){
      console.error(e);
      var b=document.getElementById("boot");
      if(b) b.innerHTML='<div class="bootbox"><b>Startup error</b><div style="margin-top:8px">'+String(e&&e.message||e)+'</div><button class="cta" style="margin-top:18px" onclick="location.reload()">Retry</button></div>';
    }
    return true;
  }
  function loadNext(){
    if(startApp() || loading) return;
    if(sourceIndex>=SOURCES.length){
      progress(100,"The 3D engine could not be loaded.");
      // Opened straight off the disk, the usual cause is not the network: the
      // page is on its own, without the three.min.js sitting next to it. Say
      // so, rather than sending people to check a connection that is fine.
      var local = location.protocol === "file:";
      var why = local
        ? "three.min.js wasn’t found next to this file, and no CDN could be reached."
        : "All Three.js sources failed.";
      var fix = local
        ? "Open <b>kanto-pack-opener-bundled.html</b> instead — it has the engine and all the art inline and needs nothing beside it. Otherwise keep <b>three.min.js</b> and <b>sprites-data.js</b> in the same folder as this page."
        : "Check your internet connection and reload.";
      var b=document.getElementById("boot");
      if(b) b.innerHTML='<div class="bootbox"><b>Couldn’t load the 3D engine</b><div style="margin-top:8px">'+why+'</div><div style="margin-top:10px;opacity:.85">'+fix+'</div><button class="cta" style="margin-top:18px" onclick="location.reload()">Retry</button></div>';
      return;
    }
    loading=true;
    var idx=sourceIndex++, src=SOURCES[idx];
    var base=5+idx*28;
    progress(base,"Getting the 3D engine ready… (source "+(idx+1)+"/"+SOURCES.length+")");
    var sc=document.createElement("script");
    sc.src=src; sc.async=false;
    var done=false;
    var timer=setTimeout(function(){
      if(done)return; done=true; loading=false;
      progress(Math.min(base+8,90),"Source timed out — trying another…");
      sc.remove(); setTimeout(loadNext,50);
    },8000);
    sc.onload=function(){
      if(done)return; done=true; clearTimeout(timer); loading=false;
      progress(Math.min(base+20,92),"3D engine downloaded. Starting…");
      setTimeout(loadNext,0);
    };
    sc.onerror=function(){
      if(done)return; done=true; clearTimeout(timer); loading=false;
      progress(Math.min(base+8,90),"Source failed — trying another…");
      sc.remove(); setTimeout(loadNext,50);
    };
    document.head.appendChild(sc);
  }
  // The app definition is already parsed above, so there is no race with bootPackOpener.
  progress(2,"Preparing the 3D engine…");
  loadNext();
})();
</script>
