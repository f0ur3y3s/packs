  grid: document.getElementById("grid"),
  sumLede: document.getElementById("sumLede"),
  again: document.getElementById("again"),
  sound: document.getElementById("sound")
};

let state = "idle";       // idle | tearing | dealing | viewing | done
let cards = [];
let index = 0;
let tearProgress = 0;
let packsOpened = 0;

function setHint(html){ UI.hint.innerHTML = html; }

function buildPips(){
  UI.pips.innerHTML="";
  cards.forEach(()=>{ const d=document.createElement("div"); d.className="pip"; UI.pips.appendChild(d); });
}
function updatePips(){
  const nodes = UI.pips.children;
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i]; n.className="pip";
    if(cards[i].revealed){ n.classList.add(cards[i].holo!=="none" ? "hit":"done"); }
    if(i===index && state==="viewing") n.classList.add("now");
  }
}

/* ---------- start a new pack ---------- */
function newPack(){
  // clear old
  cards.forEach(c=>{ if(c.pivot) scene.remove(c.pivot); });
  cards = generatePack();
  index=0; tearProgress=0; tweens.length=0;
  if(packGroup){ scene.remove(packGroup); packGroup=null; }
  buildPackMeshes();
  packGroup.scale.setScalar(0.001);
  tween(0.65, k=>{ packGroup.scale.setScalar(lerp(0.001,1,k)); }, back);
  state="idle";
  UI.summary.classList.remove("on");
  UI.pips.innerHTML="";
  UI.meter.style.opacity="0";
  UI.action.style.display="none";
  setHint("Drag sideways across the <b>tear strip</b> at the top of the pack");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    if(state==="idle" && tearProgress===0) UI.action.style.display="block";
  }, 7000);
}
let idleTimer = null;

/* ---------- tearing ---------- */
function applyTear(){
  const p = easeOut(tearProgress);
  packTopPivot.rotation.x = -p*1.15;
  packTopPivot.position.z = TOP_PIVOT_Z + p*0.06;
  if(packBodyJag) packBodyJag.visible = tearProgress > 0.02;
  if(packTopJag)  packTopJag.visible  = tearProgress > 0.02;
  UI.meterFill.style.width = (tearProgress*100)+"%";
}

function finishTear(){
  state="dealing";
  UI.meter.style.opacity="0";
  Audio2.bigRip();
  if(navigator.vibrate) navigator.vibrate([18,30,40]);
  setHint("");

  // whatever angle the float left behind, drive it to zero before cards show
  const r0x = packGroup.rotation.x, r0y = packGroup.rotation.y;
  tween(0.3, k=>{
    packGroup.rotation.x = lerp(r0x, 0, k);
    packGroup.rotation.y = lerp(r0y, 0, k);
  }, easeOut);

  const startRot = packTopPivot.rotation.x;
  tween(0.45, k=>{
    packTopPivot.rotation.x = startRot - k*2.2;
    packTopPivot.position.y = lerp(PACK.h-PACK.topH-PACK.h/2, PACK.h*1.25, k);
    packTopPivot.position.x = k*2.2;
    packTopPivot.rotation.z = k*1.6;
    packTopPivot.scale.setScalar(1-k*0.3);
  }, easeOut, ()=>{ packTopPivot.visible=false; });

  dealCards();

  // The wrapper is pulled down first. That gives the cards real upward
  // travel out of the opening instead of hopping up and falling back into
  // the same spot the pack was already occupying.
  tween(0.34, k=>{
    packGroup.position.y = lerp(0.05, PACK_DROP_Y, k);
    packBody.scale.set(1, 1-k*0.03, 1);
  }, easeInOut);
  tween(0.55, k=>{
    packGroup.position.y = PACK_DROP_Y - k*4.9;
    packGroup.scale.setScalar(lerp(1,0.94,k));
  }, easeInOut, ()=>{ scene.remove(packGroup); packGroup=null; }, 0.80);
}

/* ---------- dealing ---------- */
// The active card sits on the fitted plane at z=0. Everything still waiting
// sits far enough back that a full tilt or flip can never sweep into it:
// half the card diagonal at max rotation is ~0.65, so the deck starts at -1.1.
// Where the wrapper is pulled down to before the cards are drawn out, and
// the spot inside it where the cards wait. A full-size card (1.72 x 2.405)
// now clears the opened interior (1.90 x 2.55) on every side, so the cards
// need no shrinking to stay concealed.
const PACK_DROP_Y = -0.85;
const CARD_HIDDEN_Y = PACK_DROP_Y - 0.15;

// World-space room between the top of a settled card and the top of frame.
// Depends on the camera fit, so it shrinks on wide viewports instead of
// throwing cards past the edge.
function headroom(){
  const halfVisible = camera.position.z * Math.tan((camera.fov*Math.PI/180)/2);
  return Math.max(0.18, halfVisible - CARD_MESH_H/2 - 0.08);
}

function stackPos(i){
  const off = i - index;
  if(off <= 0) return {x:0, y:0, z:0};
  return { x:0, y:-0.014*off, z:-1.1 - 0.032*off };
}

function dealCards(){
  if(!cards.length){ cards = generatePack(); }

  // Cards wait at full size inside the lowered wrapper, stacked through its
  // depth so none of them intersect each other, and all of them sit behind
  // its front face — that occlusion is what reads as "inside the pack".
  cards.forEach((card,i)=>{
    const pivot = makeCardMesh(card);
    card.revealed=false; card.flipped=false;
    card.tiltSeed = (Math.random()-0.5);
    card.startZ = 0.077 - i*0.017;
    pivot.position.set(0, CARD_HIDDEN_Y, card.startZ);
    pivot.rotation.set(0, Math.PI, 0);
    pivot.scale.setScalar(1);
    pivot.visible = false;
    scene.add(pivot);
  });
  buildPips();

  const n = cards.length;
  const bump = Math.min(0.12, headroom()*0.4);

  cards.forEach((card,i)=>{
    const to = stackPos(i);
    tween(0.7, k=>{
      card.pivot.visible = true;
      const e = easeOut(k);
      // A straight vertical slide. No arc, no sway, no tumble: a card being
      // drawn out of a wrapper doesn't swing sideways, and any roll while it
      // still overlaps the pack throws its corners outside the wrapper.
      card.pivot.position.x = 0;
      card.pivot.position.y = lerp(CARD_HIDDEN_Y, to.y, e) + Math.sin(k*Math.PI)*bump;
      // depth is held until the wrapper has fallen away — see the settle tween
      // below. Moving back toward the deck during the rise drove the card out
      // through the rear face of the pack.
      card.pivot.position.z = card.startZ;
      card.pivot.rotation.x = 0;
      card.pivot.rotation.y = Math.PI;
      // a whisper of roll, only once it is fully clear of the wrapper
      card.pivot.rotation.z = Math.sin(clamp((k-0.72)/0.28,0,1)*Math.PI) * card.tiltSeed * 0.05;
      card.pivot.scale.setScalar(1);
    }, easeInOut, null, 0.50 + (n-1-i)*0.03);

    // The card's resting height is below the wrapper's rim, so it never rises
    // clear of the pack — the pack drops away instead. Only once it has can a
    // card move back to its deck depth without cutting through the foil.
    tween(0.45, k=>{
      card.pivot.position.z = lerp(card.startZ, to.z, k);
    }, easeInOut, ()=>{
      if(i===0){
        card.pivot.rotation.z = 0;
        state="viewing"; index=0; updatePips();
        setHint("<b>Tap the card</b> to flip it");
      }
    }, 1.05);
  });

  cards.forEach((c,i)=>{ c.pivot.renderOrder = n-i; });
  Audio2.whoosh();
}

/* ---------- flip / advance ---------- */
let tilt = {x:0,y:0,tx:0,ty:0};

function flipCurrent(){
  const card = cards[index];
  if(!card || card.flipped) return;
  card.flipped=true;
  Audio2.flip();
  if(navigator.vibrate) navigator.vibrate(12);
  let celebrated=false;
  tween(0.62, (k)=>{
    card.pivot.rotation.y = lerp(Math.PI, 0, k);
    card.pivot.position.z = Math.sin(k*Math.PI)*0.5;
    card.pivot.scale.setScalar(1 + Math.sin(k*Math.PI)*0.07);
    card.frontMat.uniforms.uHolo.value = card.holo==="none" ? 0 : clamp((k-0.45)/0.45,0,1);
    if(!celebrated && k>0.55 && card.holo!=="none"){ celebrated=true; celebrate(card); }
  }, easeInOut, ()=>{
    card.revealed=true;
    card.frontMat.uniforms.uHolo.value = card.holo==="none"?0:1;
    Motion.recentre();
    updatePips();
    setHint(index===cards.length-1
      ? "<b>Drag to tilt</b> · tap to see your pull"
      : "<b>Drag to tilt</b> · tap for the next card");
  });
  updatePips();
}

function celebrate(card){
  const rare = card.holo==="rare";
  FX.burst(rare?"rare":"reverse");
  Audio2.holo(card.holo);
  if(navigator.vibrate) navigator.vibrate(rare?[30,40,30,40,80]:[20,40,40]);
  UI.bannerBig.textContent = rare ? "HOLO RARE" : "REVERSE HOLO";
  UI.bannerSub.textContent = card.mon.name.toUpperCase();
  UI.banner.classList.add("on");
  setTimeout(()=>UI.banner.classList.remove("on"), rare?2100:1500);
}

function nextCard(){
  const card = cards[index];
  if(!card) return;
  Audio2.whoosh();
  tilt.tx=0; tilt.ty=0;
  const c = card;
  const dir = (index%2)?-1:1;
  tween(0.5, k=>{
    c.pivot.position.x = k*dir*4.5;
    c.pivot.position.y = k*0.6;
    c.pivot.rotation.z = k*dir*0.9;
    c.pivot.rotation.y = k*dir*0.7;
    c.pivot.scale.setScalar(1-k*0.25);
  }, easeInOut, ()=>{ c.pivot.visible=false; });

  if(index>=cards.length-1){
    state="done";
    setTimeout(showSummary, 420);
    return;
  }
  index++;
  updatePips();
  setHint("<b>Tap the card</b> to flip it");
  // bring the rest of the stack forward
  for(let i=index;i<cards.length;i++){
    const c2 = cards[i], target = stackPos(i);
    const from = {x:c2.pivot.position.x,y:c2.pivot.position.y,z:c2.pivot.position.z,s:c2.pivot.scale.x};
    tween(0.4, k=>{
      c2.pivot.position.x = lerp(from.x,target.x,k);
      c2.pivot.position.y = lerp(from.y,target.y,k);
      c2.pivot.position.z = lerp(from.z,target.z,k);
      c2.pivot.scale.setScalar(lerp(from.s, 1, k));
    }, easeOut);
  }
}

/* ---------- summary ---------- */
function showSummary(){
  packsOpened++;
  renderSummary();
}
function renderSummary(){
  UI.grid.innerHTML="";
  let holos=0, reverses=0;
  cards.forEach(card=>{
    const d=document.createElement("div");
    d.className="thumb"+(card.holo==="rare"?" hit":card.holo==="reverse"?" rev":"");
    const img=document.createElement("img");
    img.alt = card.mon.name;
    try {
      img.src = card.frontCanvas.toDataURL("image/png");
      d.appendChild(img);
    } catch(e){
      // a cross-origin image tainted the canvas; show the name instead
      const label=document.createElement("div");
      label.style.cssText="display:grid;place-items:center;height:100%;font-size:11px;font-weight:700;padding:6px;text-align:center";
      label.textContent = card.mon.name;
      d.appendChild(label);
    }
    if(card.holo!=="none"){
      const t=document.createElement("span");
      t.className="tag "+(card.holo==="rare"?"g":"t");
      t.textContent = card.holo==="rare"?"HOLO":"REVERSE";
      d.appendChild(t);
      if(card.holo==="rare") holos++; else reverses++;
    } else if(card.mon.rarity==="R"){
      const t=document.createElement("span"); t.className="tag"; t.textContent="RARE"; d.appendChild(t);
    }
    UI.grid.appendChild(d);
  });
  const rare = cards.find(c=>c.mon.rarity==="R");
  UI.sumLede.textContent = holos
    ? `${rare.mon.name} came out holo. That is roughly a one-in-three pack.`
    : `Your rare this pack is ${rare.mon.name}. ${reverses?"The reverse holo is "+cards.find(c=>c.holo==="reverse").mon.name+".":""}`;
  UI.summary.classList.add("on");
  setHint("");
}

/* ============================================================
   12. Input
   ============================================================ */
let pointer = {down:false, x0:0, y0:0, x:0, y:0, moved:0, t0:0, target:null};

function localPoint(e){
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX, y:t.clientY};
}

function onDown(e){
  Audio2.unlock();
  const p = localPoint(e);
  pointer.down=true; pointer.x0=p.x; pointer.y0=p.y; pointer.x=p.x; pointer.y=p.y;
  pointer.moved=0; pointer.t0=performance.now();

  if(state==="idle"){
    // is the touch near the top of the pack?
    pointer.target = "pack";
    UI.meter.style.opacity="1";
    UI.action.style.display="none";
    clearTimeout(idleTimer);
  } else if(state==="viewing"){
    pointer.target = "card";
  } else pointer.target=null;
}

function onMove(e){
  if(!pointer.down) return;
  const p = localPoint(e);
  const dx = p.x-pointer.x, dy = p.y-pointer.y;
  pointer.moved += Math.abs(dx)+Math.abs(dy);
  pointer.x=p.x; pointer.y=p.y;

  if(pointer.target==="pack" && state==="idle"){
    const before = tearProgress;
    tearProgress = clamp(tearProgress + Math.abs(dx)/(window.innerWidth*0.62), 0, 1);
    applyTear();
    if(Math.floor(before*14)!==Math.floor(tearProgress*14)){
      Audio2.rip(0.6+tearProgress*0.8);
      if(navigator.vibrate) navigator.vibrate(6);
    }
    if(tearProgress>=1){ pointer.down=false; finishTear(); }
  }
  else if(pointer.target==="card" && state==="viewing"){
    const card = cards[index];
    if(card && card.flipped){
      tilt.ty = clamp((pointer.x-pointer.x0)/window.innerWidth*1.6, -0.55, 0.55);
      tilt.tx = clamp((pointer.y-pointer.y0)/window.innerHeight*1.1, -0.4, 0.4);
    } else {
      // small peek wobble before the flip
      tilt.ty = clamp((pointer.x-pointer.x0)/window.innerWidth*0.7, -0.25, 0.25);
    }
  }
}

function onUp(){
  if(!pointer.down) return;
  const tapped = pointer.moved < 14 && (performance.now()-pointer.t0) < 400;
  pointer.down=false;
  tilt.tx=0; tilt.ty=0;

  if(state==="idle"){
    UI.meter.style.opacity = tearProgress>0 ? "1" : "0";
    if(tearProgress>0 && tearProgress<1){
      // spring back a little if they let go early
      const from = tearProgress;
      tween(0.35, k=>{ tearProgress = lerp(from, from*0.55, k); applyTear(); }, easeOut);
      setHint("Keep dragging — the strip is almost off");
    } else if(tapped){
      setHint("Drag <b>sideways</b> across the tear strip at the top");
    }
  } else if(state==="viewing" && tapped){
    const card = cards[index];
    if(!card) return;
    if(!card.flipped) flipCurrent();
    else if(card.revealed) nextCard();
  }
}

const el = renderer.domElement;
el.addEventListener("touchstart", e=>{e.preventDefault(); onDown(e);}, {passive:false});
el.addEventListener("touchmove", e=>{e.preventDefault(); onMove(e);}, {passive:false});
el.addEventListener("touchend", e=>{e.preventDefault(); onUp(e);}, {passive:false});
el.addEventListener("touchcancel", onUp);
el.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);

UI.action.addEventListener("click", ()=>{
  if(state!=="idle") return;
  Audio2.unlock(); Audio2.tap();
  UI.action.style.display="none";
  UI.meter.style.opacity="1";
  const from = tearProgress;
  tween(1.0, k=>{
    tearProgress = lerp(from, 1, k); applyTear();
    if(Math.random()<0.35) Audio2.rip(0.5+tearProgress*0.8);
  }, easeInOut, ()=>{ if(state==="idle") finishTear(); });
});

UI.again.addEventListener("click", ()=>{ Audio2.tap(); newPack(); });
const Motion = (function(){
  let enabled=false, receiving=false, base=null;
  let tx=0, ty=0, cx=0, cy=0;
  const RANGE = 32;   // degrees of tilt for the full sweep

  function screenAngle(){
    if(window.screen && screen.orientation && typeof screen.orientation.angle === "number")
      return screen.orientation.angle;
    return window.orientation || 0;
  }
  function onOrient(e){
    if(e.beta == null || e.gamma == null) return;
    receiving = true;
    const a = screenAngle()*Math.PI/180;
    const g =  e.gamma*Math.cos(a) + e.beta*Math.sin(a);
    const b =  e.beta *Math.cos(a) - e.gamma*Math.sin(a);
    if(!base) base = {b:b, g:g};
    ty = clamp((g-base.g)/RANGE, -1, 1);
    tx = clamp((b-base.b)/RANGE, -1, 1);
  }
  return {
    supported(){ return typeof DeviceOrientationEvent !== "undefined"; },
    needsPermission(){
      return typeof DeviceOrientationEvent !== "undefined" &&
             typeof DeviceOrientationEvent.requestPermission === "function";
    },
    isOn(){ return enabled; },
    isReceiving(){ return receiving; },
    recentre(){ base = null; },
    enable(){
      const attach = ()=>{
        window.addEventListener("deviceorientation", onOrient, true);
        enabled = true; base = null;
        return true;
      };
      if(this.needsPermission()){
        // iOS only grants this from inside a user gesture
        return DeviceOrientationEvent.requestPermission()
          .then(r => r === "granted" ? attach() : false)
          .catch(()=> false);
      }
      return Promise.resolve(attach());
    },
    disable(){
      window.removeEventListener("deviceorientation", onOrient, true);
      enabled=false; tx=0; ty=0;
    },
    step(){
      cx = lerp(cx, enabled?tx:0, 0.12);
      cy = lerp(cy, enabled?ty:0, 0.12);
      return {x:cx, y:cy};
    }
  };
})();

const tiltBtn = document.getElementById("tiltbtn");
function paintTiltBtn(){
  if(!tiltBtn) return;
  if(Motion.isOn()) tiltBtn.classList.add("on"); else tiltBtn.classList.remove("on");
}
if(tiltBtn && Motion.supported()){
  tiltBtn.hidden = false;
  tiltBtn.addEventListener("click", ()=>{
    Audio2.unlock(); Audio2.tap();
    if(Motion.isOn()){
      Motion.disable(); paintTiltBtn();
      setHint("Tilt shine off — drag a card to move the shine");
    } else {
      Promise.resolve(Motion.enable()).then(ok=>{
        paintTiltBtn();
        setHint(ok ? "Tilt the phone to move the shine"
                   : "This browser wouldn't allow motion access");
      });
    }
  });
  // Android and desktop sensors need no prompt, so turn it on quietly and
  // hide the button again if nothing ever arrives.
  if(!Motion.needsPermission()){
    Promise.resolve(Motion.enable()).then(()=>{
      paintTiltBtn();
      setTimeout(()=>{
        if(!Motion.isReceiving()){ Motion.disable(); tiltBtn.hidden = true; }
        paintTiltBtn();
      }, 2500);
    });
  }
}

UI.sound.addEventListener("click", ()=>{
  Audio2.unlock();
  const m = !Audio2.isMuted();
  Audio2.setMuted(m);
  UI.sound.textContent = m ? "✕" : "♪";
  UI.sound.setAttribute("aria-label", m?"Unmute sound":"Mute sound");
});


/* ============================================================
   13. Loop
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  stepTweens(dt);

  if(packGroup && state==="idle"){
    if(tearProgress === 0){
      packGroup.rotation.y = Math.sin(t*0.6)*0.22;
      packGroup.rotation.x = Math.sin(t*0.45)*0.08;
      packGroup.position.y = 0.05 + Math.sin(t*1.1)*0.035;
    } else {
      // Once tearing starts the wrapper must settle square on. Rotated even a
      // few degrees, its front face sweeps back behind the cards waiting
      // inside and they show through the foil.
      packGroup.rotation.y = lerp(packGroup.rotation.y, 0, 0.2);
      packGroup.rotation.x = lerp(packGroup.rotation.x, 0, 0.2);
      packGroup.position.y = lerp(packGroup.position.y, 0.05, 0.2);
    }
  }

  tilt.x = lerp(tilt.x, tilt.tx, 0.16);
  tilt.y = lerp(tilt.y, tilt.ty, 0.16);
  const mo = Motion.step();

  cards.forEach((card,i)=>{
    if(!card.pivot || !card.pivot.visible) return;
    card.frontMat.uniforms.uTime.value = t;
    // a few degrees of wrist movement sweeps the whole pattern while the card
    // itself barely moves, which is how a real foil card behaves
    // dragging up leans the top edge away from you, as if pushing the far
    // edge back — the inverse reads as the card falling toward you
    card.frontMat.uniforms.uTilt.value.set(mo.y*1.7, mo.x*1.7);
    if(i===index && state==="viewing" && card.revealed){
      card.pivot.rotation.y = tilt.y + mo.y*0.16;
      card.pivot.rotation.x = tilt.x + mo.x*0.16;
    } else if(i===index && state==="viewing" && !card.flipped){
      card.pivot.rotation.y = Math.PI + tilt.y + Math.sin(t*0.9)*0.03;
      card.pivot.rotation.x = Math.sin(t*0.7)*0.02;
    }
  });

  renderer.render(scene,camera);
}
animate();
// Show a pack straight away using the built-in fallback art. The 151 remote
// sprites then load in the background, and the pack is rebuilt with the real
// art once they arrive — as long as it hasn't been torn open yet.
newPack();
preloadSpriteImages()
  .then(()=>{ if(state==="idle" && tearProgress===0) newPack(); })
  .catch(err=>{ console.error(err); });

};
</script>

<script>
(function(){
  var SOURCES = [
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "https://unpkg.com/three@0.128.0/build/three.min.js"
  ];
  var sourceIndex=0, loading=false, started=false;
  var bar=document.getElementById("bootProgress");
  var pct=document.getElementById("bootPercent");
  var status=document.getElementById("bootStatus");
  function progress(n,text){
    if(bar) bar.style.width=n+"%";
    if(pct) pct.textContent=Math.round(n)+"%";
    if(status && text) status.textContent=text;
  }
  function startApp(){
    if(started || !window.THREE || typeof window.bootPackOpener!=="function") return false;
    started=true;
    progress(100,"3D engine loaded. Starting pack opener…");
    try {
      window.bootPackOpener();
      var b=document.getElementById("boot");
      if(b) b.remove();
    } catch(e){
      console.error(e);
      var b=document.getElementById("boot");
      if(b) b.innerHTML='<div class="bootbox"><b>Startup error</b><div style="margin-top:8px">'+String(e&&e.message||e)+'</div><button class="cta" style="margin-top:18px" onclick="location.reload()">Retry</button></div>';
    }
    return true;
  }
  function loadNext(){
    if(startApp() || loading) return;
    if(sourceIndex>=SOURCES.length){
      progress(100,"The 3D engine could not be loaded.");
      var b=document.getElementById("boot");
      if(b) b.innerHTML='<div class="bootbox"><b>Couldn’t load the 3D engine</b><div style="margin-top:8px">All Three.js sources failed. Check your internet connection and reload.</div><button class="cta" style="margin-top:18px" onclick="location.reload()">Retry</button></div>';
      return;
    }
    loading=true;
    var idx=sourceIndex++, src=SOURCES[idx];
    var base=5+idx*28;
    progress(base,"Getting the 3D engine ready… (source "+(idx+1)+"/"+SOURCES.length+")");
    var sc=document.createElement("script");
    sc.src=src; sc.async=false;
    var done=false;
    var timer=setTimeout(function(){
      if(done)return; done=true; loading=false;
      progress(Math.min(base+8,90),"Source timed out — trying another…");
      sc.remove(); setTimeout(loadNext,50);
    },8000);
    sc.onload=function(){
      if(done)return; done=true; clearTimeout(timer); loading=false;
      progress(Math.min(base+20,92),"3D engine downloaded. Starting…");
      setTimeout(loadNext,0);
    };
    sc.onerror=function(){
      if(done)return; done=true; clearTimeout(timer); loading=false;
      progress(Math.min(base+8,90),"Source failed — trying another…");
      sc.remove(); setTimeout(loadNext,50);
    };
    document.head.appendChild(sc);
  }
  // The app definition is already parsed above, so there is no race with bootPackOpener.
  progress(2,"Preparing the 3D engine…");
  loadNext();
})();
</script>
