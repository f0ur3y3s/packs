<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1e">
<title>Kanto Pack Opener</title>
<style>
  :root{
    /* Taken from the set's own artefacts rather than picked in the abstract:
       the navy is the card back's field, the paper its stock, the gold its
       ribbon and the red its ball. Teal stays, but only to mean foil. */
    --ink:#070c22;
    --ink-2:#0f1a44;
    --navy:#133477;
    --foil:#42e8d8;
    --foil-2:#ff4fa3;
    --gold:#f6c828;
    --gold-2:#ffe27a;
    --red:#d6182b;
    --paper:#f4efe1;
    --muted:#8e9ccb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    /* A faint echo of the card back's sunburst over the navy, so the page
       reads as part of the same set rather than a neutral shell around it.
       Kept very low contrast: the pack has to stay the brightest thing. */
    background:
      repeating-conic-gradient(from 8deg at 50% 30%,
        rgba(255,255,255,.022) 0deg 7deg, rgba(255,255,255,0) 7deg 20deg),
      radial-gradient(125% 85% at 50% 10%, #1b2e6b 0%, #101a44 42%, #070c22 100%);
    color:var(--paper);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%}
  canvas{display:block}
  #stage canvas{width:100% !important;height:100% !important;display:block}
  #boot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:32px;text-align:center;
    background:var(--ink);font-size:14px;line-height:1.6;color:var(--muted)}
  #boot b{display:block;color:var(--paper);font-size:16px;margin-bottom:6px}
  .bootbox{width:min(340px,82vw)}
  .bootbar{height:7px;margin:18px 0 8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .bootbar i{display:block;width:0%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .18s ease}
  #bootPercent{font-size:11px;color:var(--muted);letter-spacing:.08em}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
       padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wordmark{font-weight:800;font-size:15px;letter-spacing:.14em;line-height:1;color:var(--gold);
    display:flex;align-items:center;gap:10px}
  .wordmark .ball{width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(160deg,var(--red) 0 46%,#f7f1e0 46% 54%,#d8b862 54% 100%);
    box-shadow:0 0 0 1.5px #2b2118, inset 0 0 0 3px rgba(0,0,0,.12);
    position:relative;transform:rotate(-18deg)}
  .wordmark .ball::after{content:"";position:absolute;inset:38%;border-radius:50%;
    background:#f2e6bd;box-shadow:0 0 0 1.5px #2b2118}
  .wordmark span{display:block;font-weight:500;font-size:10px;letter-spacing:.22em;
    color:var(--muted);margin-top:5px}
  .iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:var(--paper);font-size:16px;display:grid;place-items:center;backdrop-filter:blur(8px)}
  .iconbtn:active{transform:scale(.93)}
  .iconbtn.on{background:rgba(246,200,40,.20);border-color:rgba(246,200,40,.72);color:var(--gold-2)}

  #bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 18px}
  #hint{font-size:17px;line-height:1.45;letter-spacing:.01em;color:var(--paper);text-align:center;
    min-height:24px;max-width:32ch;margin:0 auto;
    transition:opacity .3s ease}
  #hint b{color:var(--paper);font-weight:600}
  .cta{pointer-events:auto;border:0;border-radius:999px;padding:15px 30px;font-size:15px;font-weight:700;
    letter-spacing:.03em;color:#3a2706;background:linear-gradient(180deg,var(--gold-2),#e0aa0c);
    box-shadow:0 10px 30px -12px rgba(246,200,40,.75);transition:transform .12s ease,opacity .2s}
  .cta:active{transform:translateY(2px) scale(.98)}
  .cta.ghost{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid rgba(255,255,255,.2);box-shadow:none}

  #pips{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:280px}
  .pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .25s ease}
  .pip.done{background:rgba(255,255,255,.55)}
  .pip.now{background:var(--gold);transform:scale(1.5)}
  .pip.hit{background:var(--gold)}

  /* ---------- rip meter ---------- */
  #meter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 118px);
    width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;transition:opacity .2s}
  #meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:4px}

  /* ---------- celebration banner ---------- */
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;transform:scale(.8);
    transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.6,.4,1)}
  #banner.on{opacity:1;transform:scale(1)}
  #banner .big{font-size:clamp(30px,11vw,52px);font-weight:900;letter-spacing:-.02em;line-height:.95;
    background:linear-gradient(100deg,#fff 10%,var(--foil) 35%,var(--foil-2) 55%,var(--gold) 80%,#fff 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 20px rgba(255,79,163,.45))}
  #banner .sub{margin-top:8px;font-size:12px;letter-spacing:.26em;color:rgba(255,255,255,.72);font-weight:600}

  /* ---------- summary ---------- */
  #summary{position:fixed;inset:0;z-index:20;background:rgba(7,12,34,.95);backdrop-filter:blur(14px);
    display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 18px)}
  #summary.on{display:flex}
  #summary h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--gold)}
  #summary p.lede{margin:6px 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
  #grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:16px;
    -webkit-overflow-scrolling:touch}
  .thumb{position:relative;border-radius:7px;overflow:hidden;background:#131d45;aspect-ratio:1/1.4}
  .thumb img{width:100%;height:100%;display:block}
  .thumb.hit{box-shadow:0 0 0 2px var(--gold),0 8px 22px -8px rgba(255,209,92,.7)}
  .thumb.rev{box-shadow:0 0 0 2px var(--foil)}
  .tag{position:absolute;left:4px;bottom:4px;font-size:8.5px;font-weight:700;letter-spacing:.08em;
    padding:2.5px 5px;border-radius:4px;background:rgba(0,0,0,.7)}
  .tag.g{color:#131033;background:var(--gold)}
  .tag.t{color:#131033;background:var(--foil)}
  #summary .row.foot{gap:10px}
  #summary .cta{flex:1}
  /* ---- binder ---- */
  #binder{position:fixed;inset:0;z-index:22;background:rgba(7,12,34,.96);backdrop-filter:blur(14px);
    display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 14px)}
  #binder.on{display:flex}
  #binder .bhead{align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  #binder h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--gold)}
  #binder .lede{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}
  #binderFilters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 11px}
  .chip{pointer-events:auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
    color:var(--paper);font:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;
    padding:7px 13px;border-radius:999px;cursor:pointer;transition:background .12s,border-color .12s}
  .chip.on{background:rgba(246,200,40,.18);border-color:rgba(246,200,40,.7);color:var(--gold-2)}
  .chip .c{opacity:.6;margin-left:5px;font-weight:600}
  #binderGrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;gap:8px;
    grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    /* Fixed row height rather than aspect-ratio: with fractional column widths
       every row rounded to a slightly different height and the grid looked
       misaligned. */
    grid-auto-rows:106px;align-content:start;padding-bottom:14px}
  .slot{position:relative;border-radius:8px;background:#111a3e;border:1px solid rgba(255,255,255,.07);
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    padding-bottom:13px;cursor:default;transition:transform .12s ease,border-color .12s ease}
  .slot.own{background:linear-gradient(160deg,#1b2a60,#121c46);border-color:rgba(255,255,255,.14);cursor:pointer}
  .slot.own:active{transform:scale(.96)}
  .slot .art{image-rendering:pixelated;background-repeat:no-repeat;flex:0 0 auto}
  .slot.miss .art{filter:brightness(0) opacity(.30)}
  .slot .no{position:absolute;top:3px;left:5px;font-size:8.5px;font-weight:700;color:rgba(255,255,255,.32);letter-spacing:.04em}
  .slot .nm{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;
    color:rgba(255,255,255,.72);padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .dup{position:absolute;top:3px;right:4px;font-size:8.5px;font-weight:800;color:#131033;
    background:rgba(255,255,255,.82);border-radius:999px;padding:1px 4px}
  .slot.holo{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px -8px rgba(255,209,92,.65)}
  .slot.rev{border-color:var(--foil);box-shadow:0 0 0 1px var(--foil)}
  #binderDetail{position:absolute;inset:0;z-index:2;background:rgba(7,12,34,.975);backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  #binderDetail[hidden]{display:none}
  #binderStage{width:min(78vw,360px);height:min(60vh,480px);touch-action:none;cursor:grab}
  #binderStage:active{cursor:grabbing}
  #binderStage canvas{display:block;width:100%;height:100%}
  #binderActions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  #binderMeta .copies{margin-top:7px;font-size:12px;opacity:.85}
  #binderDetail .meta{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.65}
  #binderDetail .meta b{color:var(--paper);font-size:15px;display:block;margin-bottom:3px}
  #binderEmpty{color:var(--muted);font-size:13px;line-height:1.6;padding:8px 2px}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud">
  <div class="row">
    <div class="wordmark"><i class="ball"></i><div>KANTO SERIES<span>10 CARDS PER PACK</span></div></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="tiltbtn" aria-label="Use phone tilt for the holo shine" hidden>✦</button>
      <button class="iconbtn" id="binderbtn" aria-label="Open your binder">▦</button>
      <button class="iconbtn" id="sound" aria-label="Mute sound">♪</button>
    </div>
  </div>

  <div id="banner"><div class="big" id="bannerBig">HOLO</div><div class="sub" id="bannerSub">RARE PULL</div></div>

  <div id="meter"><i></i></div>

  
  </div>

  <div id="bottom">
    <div id="pips"></div>
    <div id="hint">Drag across the top of the pack to tear it open</div>
    <button class="cta" id="action" style="display:none">Open the pack</button>
  </div>
</div>

<div id="summary">
  <h2>Your pull</h2>
  <p class="lede" id="sumLede"></p>
  <div id="grid"></div>
  <div class="row foot">
    <button class="cta ghost" id="binderFromSummary">Binder</button>
    <button class="cta" id="again">Open another pack</button>
  </div>
</div>

<div id="binder">
  <div class="row bhead">
    <div>
      <h2>Binder</h2>
      <p class="lede" id="binderStats"></p>
    </div>
    <button class="iconbtn" id="binderClose" aria-label="Close the binder">✕</button>
  </div>
  <div id="binderFilters">
    <button class="chip on" data-filter="all">All</button>
    <button class="chip" data-filter="owned">Collected</button>
    <button class="chip" data-filter="dupes">Duplicates</button>
    <button class="chip" data-filter="holo">Holos</button>
  </div>
  <div id="binderGrid"></div>
  <div id="binderDetail" hidden><div id="binderStage"></div><div id="binderMeta"></div><div id="binderActions"></div></div>
</div>

<div id="boot"><div class="bootbox"><b id="bootTitle">Loading the pack…</b><div id="bootStatus">Getting the 3D engine ready.</div><div class="bootbar"><i id="bootProgress"></i></div><div id="bootPercent">0%</div></div></div>



<!-- Fill-in slots for bundle-sprites.py --inline, which splices three.js and
     the sprite sheets in here as inline <script> tags to make one file that
     needs no network at all.

     Neither is a blocking <script src> on purpose. sprites-data.js is ~4 MB,
     and loading it here froze the boot screen at 0% before the engine loader
     had even run: nothing below this point parses until a blocking script
     finishes. The app now fetches it in the background once the pack is
     already on screen. -->
<!--THREE_SLOT-->
<!--SPRITE_DATA_SLOT-->

<script>
window.bootPackOpener = function(){
"use strict";

/* ============================================================
   1. DATA — Gen 1 roster, grouped by pull rarity
   ============================================================ */
const TYPES = {
  G:{name:"Grass",    hue:132, c:"#59b95f", d:"#22602f", light:"#bfe6a8", ink:"#123018"},
  R:{name:"Fire",     hue:16,  c:"#f2683c", d:"#8a2a14", light:"#ffc4a1", ink:"#3a1206"},
  W:{name:"Water",    hue:205, c:"#3d9ae0", d:"#124a80", light:"#b6ddf7", ink:"#082740"},
  L:{name:"Lightning",hue:47,  c:"#f2c331", d:"#8a6404", light:"#ffeaa6", ink:"#3a2c02"},
  P:{name:"Psychic",  hue:288, c:"#a45cc4", d:"#57216e", light:"#e0bbf0", ink:"#2d0f3a"},
  F:{name:"Fighting", hue:24,  c:"#b5754a", d:"#6a3a1c", light:"#e6c3a3", ink:"#331a0b"},
  C:{name:"Colorless",hue:220, c:"#b9bdcc", d:"#5d6376", light:"#e8eaf1", ink:"#23262f"}
};
const WEAK = {G:"R",R:"W",W:"L",L:"F",P:"P",F:"P",C:"F"};
const RESIST = {G:"W",W:"",R:"",L:"F",P:"",F:"",C:"F"};

const DEX = {
  C:`Bulbasaur,G,60;Charmander,R,50;Squirtle,W,50;Caterpie,G,40;Weedle,G,40;Pidgey,C,40;Rattata,C,30;
Spearow,C,50;Ekans,G,40;Pikachu,L,40;Sandshrew,F,40;Clefairy,C,40;Jigglypuff,C,50;Zubat,G,40;Oddish,G,50;
Paras,G,40;Venonat,G,40;Diglett,F,30;Meowth,C,50;Psyduck,W,50;Mankey,F,30;Growlithe,R,60;Vulpix,R,50;Poliwag,W,40;
Abra,P,30;Machop,F,50;Bellsprout,G,40;Tentacool,W,30;Geodude,F,50;Ponyta,R,40;Slowpoke,P,50;Magnemite,L,40;
Doduo,C,50;Seel,W,60;Grimer,G,40;Shellder,W,30;Gastly,P,30;Drowzee,P,50;Krabby,W,50;Voltorb,L,40;
Exeggcute,G,50;Cubone,F,40;Koffing,G,50;Rhyhorn,F,70;Horsea,W,40;Goldeen,W,40;Staryu,W,40;Magikarp,W,30;
Eevee,C,50;Omanyte,W,40;Kabuto,F,30;Dratini,C,40;Porygon,C,30;Ditto,C,50;Nidoran♀,G,60;Nidoran♂,G,50`,

  U:`Ivysaur,G,80;Charmeleon,R,80;Wartortle,W,70;Metapod,G,70;Kakuna,G,80;Pidgeotto,C,60;Raticate,C,60;
Fearow,C,70;Arbok,G,60;Sandslash,F,70;Nidorina,G,70;Nidorino,G,60;Gloom,G,60;Parasect,G,60;Dugtrio,F,70;
Persian,C,70;Golduck,W,70;Primeape,F,70;Poliwhirl,W,60;Kadabra,P,60;Machoke,F,80;Weepinbell,G,70;Venomoth,G,70;
Tentacruel,W,80;Graveler,F,80;Rapidash,R,70;Slowbro,P,80;Magneton,L,60;Farfetch'd,C,50;Dodrio,C,70;
Dewgong,W,80;Muk,G,70;Cloyster,W,50;Haunter,P,60;Onix,F,90;Hypno,P,90;Kingler,W,60;Electrode,L,80;
Marowak,F,60;Weezing,G,60;Seadra,W,70;Seaking,W,70;Starmie,W,60;Tangela,G,50;Lickitung,C,90;Mr. Mime,P,40;
Raichu,L,80;Golbat,G,60;Wigglytuff,C,80`,

  R:`Venusaur,G,140;Charizard,R,150;Blastoise,W,140;Butterfree,G,90;Beedrill,G,90;Pidgeot,C,110;
Nidoqueen,G,120;Nidoking,G,120;Clefable,C,100;Ninetales,R,110;Vileplume,G,110;Victreebel,G,110;Golem,F,130;
Alakazam,P,110;Machamp,F,140;Gengar,P,120;Exeggutor,G,120;Hitmonlee,F,100;Hitmonchan,F,100;Rhydon,F,130;
Chansey,C,120;Kangaskhan,C,110;Gyarados,W,130;Lapras,W,120;Vaporeon,W,110;Jolteon,L,100;Flareon,R,100;
Omastar,W,100;Kabutops,F,100;Aerodactyl,C,110;Snorlax,C,160;Articuno,W,120;Zapdos,L,120;Moltres,R,120;
Dragonair,C,90;Dragonite,C,140;Mewtwo,P,130;Mew,P,90;Poliwrath,W,120;Arcanine,R,130;Magmar,R,90;
Electabuzz,L,90;Jynx,P,90;Scyther,G,100;Pinsir,G,100;Tauros,C,100`
};

function parseDex(str, rarity){
  return str.split(";").map(s=>s.trim()).filter(Boolean).map(s=>{
    const p = s.split(",");
    return {name:p[0], type:p[1], hp:parseInt(p[2],10), rarity:rarity};
  });
}
const POOL = {C:parseDex(DEX.C,"C"), U:parseDex(DEX.U,"U"), R:parseDex(DEX.R,"R")};
// Name -> entry, so the binder can rebuild a card it has only a count for.
const MON_BY_NAME = {};
["C","U","R"].forEach(t=>POOL[t].forEach(m=>{ MON_BY_NAME[m.name]=m; }));
// Real National Dex order — also used to resolve {id} in an art URL template.
const DEX_ORDER = ("Bulbasaur,Ivysaur,Venusaur,Charmander,Charmeleon,Charizard,Squirtle,Wartortle,Blastoise,"+
"Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,"+
"Ekans,Arbok,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran♀,Nidorina,Nidoqueen,Nidoran♂,Nidorino,Nidoking,"+
"Clefairy,Clefable,Vulpix,Ninetales,Jigglypuff,Wigglytuff,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,"+
"Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,"+
"Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,"+
"Tentacruel,Geodude,Graveler,Golem,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,"+
"Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,"+
"Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,"+
"Chansey,Tangela,Kangaskhan,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx,Electabuzz,"+
"Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,"+
"Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew").split(",");
const NUMBERS = {};
DEX_ORDER.forEach((n,i)=>{ NUMBERS[n] = i+1; });

// PokeAPI reports a canonical colour per species. Six type colours across 151
// cards made every pack look the same; these ten give the border real variety
// while the type still owns the pips, glyphs and ink.
const SPECIES_PALETTE = {
  black: {c:"#4a4a55", d:"#1c1c22"},  blue:  {c:"#3d7fe0", d:"#12386f"},

/* ---- habitat scenes ------------------------------------------------------
   A layered landscape per card instead of a flat gradient, built from the
   habitat PokeAPI already gives us. Drawn, not fetched: it costs no payload,
   covers all 151 without sourcing art, and flat colour sits behind pixel
   sprites far better than a photograph would.

   Two rules this has to keep. It is seeded from the Pokemon's name, like
   statsFor, because the binder rebuilds a card from nothing but its dex number
   and a random scene would not match the card that was pulled. And it is drawn
   before the animation plate is snapshotted, so it costs nothing per frame. */
const SCENES = {
  forest:        {sky:["#cfe3b4","#9fc489"], far:"#5c8f5e", mid:"#3d6b47", near:"#27452f", spec:"trees"},
  sea:           {sky:["#cfeaf5","#9ed2e8"], far:"#4f9ec8", mid:"#2f7aa8", near:"#1d5178", spec:"waves"},
  cave:          {sky:["#6e6478","#4a4254"], far:"#3d3648", mid:"#2c2637", near:"#1b1824", spec:"stalac"},
  mountain:      {sky:["#dbe4ee","#b6c3d4"], far:"#8b93a3", mid:"#646c7c", near:"#414855", spec:"peaks"},
  grassland:     {sky:["#e7f0c4","#c3d894"], far:"#8fb35f", mid:"#6b9247", near:"#4a6b33", spec:"hills"},
  urban:         {sky:["#d9dde8","#b0b6c6"], far:"#8a90a2", mid:"#636a7c", near:"#414755", spec:"city"},
  "waters-edge": {sky:["#d6efe4","#a6d8c8"], far:"#6fb9a6", mid:"#458d84", near:"#2c5f60", spec:"waves"},
  "rough-terrain":{sky:["#efdcbb","#d6b98c"], far:"#b38d5e", mid:"#8a6844", near:"#5e462e", spec:"mesa"},
  rare:          {sky:["#e4d4f6","#bfa0e4"], far:"#8f63c4", mid:"#653f94", near:"#412663", spec:"peaks"}
};
// Time of day, picked by the seed. This is what stops thirty-five grassland
// cards looking like the same picture.
// Day is listed twice so it comes up most often. Night is striking but a dark
// Pokemon on a dark habitat is the one combination where the sprite stops
// reading, so it stays the exception, and is lifted off its floor.
const TIMES = [
  {k:0.00, sky:null,      light:1.00},               // day
  {k:0.00, sky:null,      light:1.00},               // day again
  {k:0.28, sky:"#ffb47a", light:0.94},               // golden
  {k:0.42, sky:"#6a5aa8", light:0.80},               // dusk
  {k:0.50, sky:"#232a5c", light:0.70}                // night
];
function mixCol(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const r=Math.round((pa>>16&255)*(1-t)+(pb>>16&255)*t);
  const g=Math.round((pa>>8&255)*(1-t)+(pb>>8&255)*t);
  const bl=Math.round((pa&255)*(1-t)+(pb&255)*t);
  return "rgb("+r+","+g+","+bl+")";
}
function tone(hex, T){
  const base = T.sky ? mixCol(hex, T.sky, T.k) : hex;
  if(T.light === 1) return base;
  const m = base.match(/\d+/g);
  return "rgb(" + m.map(v=>Math.round(v*T.light)).join(",") + ")";
}
// One band of terrain across the window, its outline wobbled by the seed.
function ridge(ctx, x, y, w, h, top, amp, step, fill){
  ctx.beginPath();
  ctx.moveTo(x, y+h);
  for(let px=0; px<=w+step; px+=step){
    const t = Math.min(px, w);
    ctx.lineTo(x+t, top + (Math.sin((t/w)*6.3 + amp.p)*0.5 + amp.r())*amp.a);
  }
  ctx.lineTo(x+w, y+h);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
function drawHabitatScene(ctx, habitat, name, x, y, w, h){
  const S = SCENES[habitat] || SCENES.grassland;
  const rnd = mulberry32(hashStr(name + "·scene"));
  const T = TIMES[(rnd()*TIMES.length)|0];
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();

  const sky = ctx.createLinearGradient(x,y,x,y+h);
  sky.addColorStop(0, tone(S.sky[0], T));
  sky.addColorStop(1, tone(S.sky[1], T));
  ctx.fillStyle = sky; ctx.fillRect(x,y,w,h);

  // Sun or moon, low and off to one side.
  const discX = x + w*(0.18 + rnd()*0.64), discY = y + h*(0.16 + rnd()*0.18);
  const discR = h*(0.055 + rnd()*0.04);
  ctx.globalAlpha = T.light < 0.7 ? 0.85 : 0.55;
  ctx.fillStyle = T.light < 0.7 ? "#f2f0ff" : "#fffbe8";
  ctx.beginPath(); ctx.arc(discX, discY, discR, 0, 6.29); ctx.fill();
  ctx.globalAlpha = 1;

  const horizon = y + h*(0.44 + rnd()*0.12);
  ridge(ctx, x, y, w, h, horizon - h*0.10, {a:h*0.09, p:rnd()*6.3, r:rnd}, 30, tone(S.far, T));
  ridge(ctx, x, y, w, h, horizon + h*0.06, {a:h*0.07, p:rnd()*6.3, r:rnd}, 24, tone(S.mid, T));
  ridge(ctx, x, y, w, h, y + h*0.82,       {a:h*0.06, p:rnd()*6.3, r:rnd}, 34, tone(S.near, T));

  // Scatter: a handful of marks on the near band so it is not a bare shape.
  ctx.fillStyle = tone(S.mid, T); ctx.globalAlpha = 0.5;
  for(let i=0;i<18;i++){
    const sx = x + rnd()*w, sy = y + h*(0.84 + rnd()*0.14), r = 1.5 + rnd()*3.5;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Lift the middle so a dark sprite still reads against a dark habitat.
  const pop = ctx.createRadialGradient(x+w/2, y+h*0.54, h*0.06, x+w/2, y+h*0.54, h*0.78);
  pop.addColorStop(0, "rgba(255,255,255,0.13)");
  pop.addColorStop(1, "rgba(0,0,0,0.16)");
  ctx.fillStyle = pop; ctx.fillRect(x,y,w,h);
  ctx.restore();
}

/* ============================================================
   2. Small utilities
   ============================================================ */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;} return h>>>0; }
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.70158+1;return 1+ c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);};
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function shade(hex, amt){ // amt -1..1
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>0){r=r+(255-r)*amt;g=g+(255-g)*amt;b=b+(255-b)*amt;}
  else{r*=1+amt;g*=1+amt;b*=1+amt;}
  return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
}


/* ============================================================
   3. Sprite art
   ============================================================ */
// Sprites are keyed by National Dex number (NUMBERS[name]) rather than by a
// slugified name. That removes the per-name filename mapping the old host
// needed for Nidoran♀/♂, Farfetch'd and Mr. Mime.
//
// crossOrigin is mandatory here, not cosmetic: each card face is drawn to a 2D
// canvas which THREE uploads as a WebGL texture, and a canvas tainted by a
// non-CORS image makes that upload throw SecurityError. The previous host
// (projectpokemon.org) sends no Access-Control-Allow-Origin, so every sprite
// downloaded and was then discarded by the browser. Every host below sends
// Access-Control-Allow-Origin: *.
const SPRITE_DATA_URL = "sprites-data.js";
const SPRITE_FILE = "sprites/pokemon/other/showdown/{id}.gif";
const spritePath = id => SPRITE_FILE.replace("{id}", id);
const SPRITE_HOSTS = [
  // jsdelivr first: three.js already loads from it, so it is known reachable.
  id => "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/" + spritePath(id),
  id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/" + spritePath(id),
  id => "https://cdn.statically.io/gh/PokeAPI/sprites/master/" + spritePath(id),
  id => "https://images.weserv.nl/?url=" + encodeURIComponent(
          "raw.githubusercontent.com/PokeAPI/sprites/master/" + spritePath(id))
];
const SPRITE_IMAGES = {};
const SPRITE_FAILURES = [];

let bootProgressValue = 0;
function setBootProgress(percent, status){
  bootProgressValue = Math.max(0, Math.min(100, percent));
  const bar=document.getElementById("bootProgress");
  const pct=document.getElementById("bootPercent");
  const st=document.getElementById("bootStatus");
  if(bar) bar.style.width=bootProgressValue+"%";
  if(pct) pct.textContent=Math.round(bootProgressValue)+"%";
  if(st && status) st.textContent=status;
}

// Resolve to the decoded <img> or null. A host that hangs is treated as a
// failure so one dead origin cannot stall the whole preload.
function loadImageFrom(src, timeoutMs, useCors){
  return new Promise(resolve=>{
    const img = new Image();
    if(useCors) img.crossOrigin = "anonymous";
    let settled = false, timer = 0;
    const finish = ok => {
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(ok ? img : null);
    };
    timer = setTimeout(()=>finish(false), timeoutMs);
    img.onload  = ()=>finish(Boolean(img.naturalWidth));
    img.onerror = ()=>finish(false);
    img.src = src;
  });
}

// Normalize whatever we managed to load into one shape the card code can draw:
// an atlas of n frames laid out in `cols` columns, with cumulative timings.
// A bundled animated entry carries its own geometry. Anything else — a static
// bundle, or a GIF pulled from a CDN, which a canvas only ever draws the first
// frame of — becomes a single still frame, which the same code path handles.
function makeSpriteRecord(img, entry){
  if(entry && typeof entry === "object" && entry.n > 1){
    const cum = []; let acc = 0;
    for(let i=0;i<entry.d.length;i++){ acc += entry.d[i]; cum.push(acc); }
    return {img, fw:entry.fw, fh:entry.fh, n:entry.n, cols:entry.cols, cum, total:acc};
  }
  return {img, fw:img.naturalWidth, fh:img.naturalHeight, n:1, cols:1, cum:[0], total:0};
}

async function loadSpriteImage(mon){
  const id = NUMBERS[mon.name];
  if(!id) return false;
  // Bundled sprites (sprites-data.js) skip the network entirely. A data: URI
  // never taints the canvas, so crossOrigin is neither needed nor wanted.
  const entry = window.SPRITE_DATA && window.SPRITE_DATA[id];
  if(entry){
    const img = await loadImageFrom(typeof entry === "string" ? entry : entry.src, 10000, false);
    if(img){ SPRITE_IMAGES[mon.name] = makeSpriteRecord(img, entry); return true; }
  }
  for(let i=0;i<SPRITE_HOSTS.length;i++){
    const url = SPRITE_HOSTS[i](id);
    const img = await loadImageFrom(url, 6000, true);
    if(img){ SPRITE_IMAGES[mon.name] = makeSpriteRecord(img, null); return true; }
    if(i === SPRITE_HOSTS.length-1) SPRITE_FAILURES.push(mon.name + " -> " + url);
  }
  return false;
}

// Which frame of rec is showing at `ms` into its loop. n is at most a few
// dozen, so a scan beats keeping a cursor per card.
function spriteFrameAt(rec, ms){
  if(rec.n <= 1 || !rec.total) return 0;
  const x = ms % rec.total;
  for(let i=0;i<rec.n;i++) if(x < rec.cum[i]) return i;
  return rec.n - 1;
}

// One small scratch canvas, reused, for turning the current frame into a
// silhouette. Rebuilding it per repaint costs a few operations on an ~84x78
// canvas; caching a silhouette atlas per sprite would be faster but holds
// megabytes per card, and repaints only happen at the GIF's frame rate.
let spriteScratch = null;
function silhouetteOf(rec, sx, sy){
  if(!spriteScratch){
    spriteScratch = document.createElement("canvas");
    spriteScratch.ctx = spriteScratch.getContext("2d");
  }
  const c = spriteScratch, x = c.ctx;
  if(c.width !== rec.fw || c.height !== rec.fh){ c.width = rec.fw; c.height = rec.fh; }
  x.clearRect(0,0,rec.fw,rec.fh);
  x.globalCompositeOperation = "source-over";
  x.drawImage(rec.img, sx, sy, rec.fw, rec.fh, 0, 0, rec.fw, rec.fh);
  x.globalCompositeOperation = "source-in";      // keep alpha, replace colour
  x.fillStyle = "#000";
  x.fillRect(0,0,rec.fw,rec.fh);
  x.globalCompositeOperation = "source-over";
  return c;
}

// Draw one atlas frame centred in the card's art window, over a soft drop
// shadow that follows the animation.
function drawSpriteFrame(ctx, rec, frame, artX, artY, artW, artH){
  const pad = 10;
  const boxW = artW - pad*2, boxH = artH - pad*2;
  // Snap to a whole-pixel multiple. At a fractional scale nearest-neighbour
  // gives some source rows 3 screen pixels and others 4, which reads as a
  // ragged, shimmering edge on the sprite.
  // Whole-pixel scaling is crisper for pixel art, but only worth taking when
  // it costs almost nothing. Flooring every scale above 2x meant a sprite
  // fitting at 2.98 was drawn at 2.00 -- a third smaller than a neighbour
  // fitting at 1.97, which kept its exact scale. Across the 151 that was a
  // mean loss of 11% and a worst case of 33%, and it is why sizes looked
  // inconsistent from card to card. Snap only within 8%.
  let scale = Math.min(boxW/rec.fw, boxH/rec.fh);
  const whole = Math.floor(scale);
  if(whole >= 2 && whole/scale >= 0.92) scale = whole;
  const dw = rec.fw*scale, dh = rec.fh*scale;
  const sx = (frame % rec.cols) * rec.fw, sy = Math.floor(frame / rec.cols) * rec.fh;
  const dx = artX + pad + (boxW-dw)/2, dy = artY + pad + (boxH-dh)/2;

  // Shadow: the same silhouette stamped a few times at growing offsets, which
  // fakes a blur far more cheaply than an actual one and survives browsers
  // without canvas filter support.
  const sil = silhouetteOf(rec, sx, sy);
  const off = Math.max(2, scale);
  ctx.save();
  ctx.beginPath(); ctx.rect(artX, artY, artW, artH); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  const passes = [[0.7,1.0,0.20],[1.15,1.7,0.15],[1.7,2.5,0.10]];
  for(let i=0;i<passes.length;i++){
    const P = passes[i];
    ctx.globalAlpha = P[2];
    ctx.drawImage(sil, 0,0,rec.fw,rec.fh,
                  dx + off*P[0], dy + off*P[1], dw, dh);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(rec.img, sx, sy, rec.fw, rec.fh, dx, dy, dw, dh);
  ctx.restore();
}

async function preloadSpriteImages(){
  const all = DEX_ORDER.map(name=>({name:name}));
  const bundled = Boolean(window.SPRITE_DATA);
  let done = 0, failed = 0, next = 0;
  SPRITE_FAILURES.length = 0;
  setBootProgress(8, bundled ? "Decoding bundled sprites…" : "Preparing 151 Pokémon images…");
  // A fixed pool of workers rather than serial batches: one slow or dead
  // request no longer stalls the nine others sitting in its batch.
  const CONCURRENCY = 12;
  async function worker(){
    while(next < all.length){
      const mon = all[next++];
      const ok = await loadSpriteImage(mon);
      if(!ok) failed++;
      done++;
      setBootProgress(8 + (done/all.length)*87, `Loading Pokémon artwork… ${done}/${all.length}`);
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY, all.length)}, worker));
  if(failed){
    setBootProgress(100, `Artwork ready — ${failed} image${failed===1?"":"s"} unavailable.`);
    // The draw site degrades to drawCreature silently, so the console is the
    // only place a failure is visible. Log the URLs that were actually tried.
    console.warn(`[art] ${failed}/${all.length} sprites failed:`, SPRITE_FAILURES);
  } else {
    setBootProgress(100, "All Pokémon artwork loaded.");
    console.info(`[art] ${all.length}/${all.length} sprites loaded` + (bundled ? " from the bundle." : " from the network."));
  }
  return {done, failed};
}
function drawTypeGlyph(ctx,type,cx,cy,r,color){
  ctx.save(); ctx.translate(cx,cy); ctx.fillStyle=color; ctx.strokeStyle=color;
  ctx.lineWidth=r*0.24; ctx.lineCap="round"; ctx.lineJoin="round";
  if(type==="G"){
    ctx.beginPath(); ctx.moveTo(0,r*.9);
    ctx.bezierCurveTo(-r*1.1,r*.2,-r*.7,-r,0,-r);
    ctx.bezierCurveTo(r*.7,-r,r*1.1,r*.2,0,r*.9); ctx.fill();
  } else if(type==="R"){
    ctx.beginPath(); ctx.moveTo(0,-r);
    ctx.bezierCurveTo(r*.9,-r*.1,r*.5,r*.9,0,r);
    ctx.bezierCurveTo(-r*.5,r*.9,-r*.9,-r*.1,0,-r); ctx.fill();
  } else if(type==="W"){
    ctx.beginPath(); ctx.moveTo(0,-r);
    ctx.bezierCurveTo(r*.85,-r*.05,r*.75,r,0,r);
    ctx.bezierCurveTo(-r*.75,r,-r*.85,-r*.05,0,-r); ctx.fill();
  } else if(type==="L"){
    ctx.beginPath(); ctx.moveTo(r*.35,-r); ctx.lineTo(-r*.55,r*.12);
    ctx.lineTo(-r*.02,r*.12); ctx.lineTo(-r*.3,r); ctx.lineTo(r*.6,-r*.2);
    ctx.lineTo(r*.05,-r*.2); ctx.closePath(); ctx.fill();
  } else if(type==="P"){
    ctx.beginPath(); ctx.arc(0,0,r*.95,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation="destination-out";
    ctx.beginPath(); ctx.arc(r*.16,-r*.1,r*.42,0,Math.PI*2); ctx.fill(); ctx.restore();
  } else if(type==="F"){
    ctx.beginPath(); ctx.moveTo(-r*.9,0); ctx.lineTo(0,-r*.9); ctx.lineTo(r*.9,0);
    ctx.lineTo(0,r*.9); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rad=i%2?r*.44:r; ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function hsl(h,s,l){ h=((h%360)+360)%360; return "hsl("+(h|0)+","+(clamp(s,5,100)|0)+"%,"+(clamp(l,4,96)|0)+"%)"; }

function drawArtBackdrop(ctx, W, H, mon){
  const rng = mulberry32(hashStr(mon.name+"\u00b7bg2"));
  const T = TYPES[mon.type];

  const bg = ctx.createLinearGradient(W*rng()*0.6, 0, W*0.5, H);
  bg.addColorStop(0, shade(T.c, 0.32+rng()*0.34));
  bg.addColorStop(0.55, T.c);
  bg.addColorStop(1, shade(T.d, rng()*0.22));
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const style = Math.floor(rng()*4);
  ctx.save();
  if(style===0){
    ctx.globalAlpha=.13; ctx.translate(W*(0.3+rng()*0.4), H*(0.08+rng()*0.24));
    ctx.rotate(rng()*0.6-0.3); ctx.fillStyle="#fff";
    const n=7+Math.floor(rng()*7);
    for(let i=0;i<n;i++){ ctx.save(); ctx.rotate(i*Math.PI*2/n);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-W*0.05,H*2.2); ctx.lineTo(W*0.05,H*2.2);
      ctx.closePath(); ctx.fill(); ctx.restore(); }
  } else if(style===1){
    ctx.globalAlpha=.15; ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(2,W*0.008);
    const rx=W*(0.32+rng()*0.34), ry=H*(0.3+rng()*0.36);
    for(let i=1;i<=8;i++){ ctx.beginPath(); ctx.arc(rx,ry,i*W*0.075,0,7); ctx.stroke(); }
  } else if(style===2){
    ctx.globalAlpha=.19; ctx.fillStyle="#fff";
    for(let j=0;j<2;j++){
      const base=H*(0.6+j*0.13);
      ctx.beginPath(); ctx.moveTo(-10,H); ctx.lineTo(-10,base);
      for(let x=0;x<=W;x+=W/6) ctx.quadraticCurveTo(x+W/12, base-H*(0.05+rng()*0.13), x+W/6, base);
      ctx.lineTo(W+10,H); ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.globalAlpha=.14; ctx.fillStyle="#fff";
    for(let i=0;i<22;i++){ const x=rng()*W,y=rng()*H,r=W*(0.014+rng()*0.032);
      ctx.save(); ctx.translate(x,y); ctx.rotate(rng()*3);
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.7,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.7,0);
      ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
  ctx.restore();

  const gl = ctx.createRadialGradient(W*.5,H*.75,4,W*.5,H*.75,W*.66);
  gl.addColorStop(0,"rgba(255,255,255,.32)"); gl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);

  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let i=0;i<14;i++){ const x=rng()*W,y=rng()*H*.9,r=1+rng()*2.6;
    ctx.globalAlpha=.18+rng()*.4; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}

/* Original creature generator. Seven body plans with independently varied
   proportions, palette, face and surface pattern, so two cards of the same
   type don't come out looking like the same animal twice. */
function drawCreature(ctx, X, Y, W, H, mon){
  const rng = mulberry32(hashStr(mon.name+"\u00b7v2"));
  const T = TYPES[mon.type];

  ctx.save();
  ctx.beginPath(); ctx.rect(X,Y,W,H); ctx.clip();
  ctx.translate(X,Y);
  drawArtBackdrop(ctx, W, H, mon);

  const h  = T.hue + rng()*84 - 42;
  const sa = 38 + rng()*42;
  const li = 44 + rng()*18;
  const C   = hsl(h, sa, li);
  const CD  = hsl(h + rng()*14-7, sa+12, li-21);
  const CL  = hsl(h + rng()*44-22, sa*0.65, li+32);
  const CA  = hsl(h + 110 + rng()*140, 72, 56);
  const OUT = hsl(h, 42, 13);
  const OL  = Math.max(3, W*0.0105);
  const ground = H*0.885, cx = W*0.5;

  ctx.lineJoin="round"; ctx.lineCap="round";
  function ink(){ ctx.strokeStyle=OUT; ctx.lineWidth=OL; }
  function ell(x,y,rx,ry,rot,col){ ink(); ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,7); ctx.stroke(); ctx.fill(); }
  function poly(pts,col){ ink(); ctx.fillStyle=col; ctx.beginPath();
    pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke(); ctx.fill(); }
  function shadow(x,y,rx){ ctx.save(); ctx.globalAlpha=.2; ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(x,y,rx,rx*0.2,0,0,7); ctx.fill(); ctx.restore(); }
  function limb(x1,y1,x2,y2,w,col){
    ctx.lineCap="round"; ctx.strokeStyle=OUT; ctx.lineWidth=w+OL*1.4;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  function curveLimb(x1,y1,mx,my,x2,y2,w,col){
    ctx.strokeStyle=OUT; ctx.lineWidth=w+OL*1.4;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke();
  }

  const eyeStyle = Math.floor(rng()*4);
  const mouthStyle = Math.floor(rng()*4);
  const eyeScale = 0.65 + rng()*0.8;
  const eyeSpread = 0.34 + rng()*0.2;
  function face(fx, fy, r){
    const eR = r*0.26*eyeScale, dx = r*eyeSpread;
    for(const sg of [-1,1]){
      const ex = fx+sg*dx, ey = fy;
      if(eyeStyle===3){
        ctx.strokeStyle=OUT; ctx.lineWidth=OL*1.3; ctx.beginPath();
        ctx.moveTo(ex-eR*0.85, ey+eR*0.15); ctx.lineTo(ex+eR*0.85, ey-eR*0.25); ctx.stroke();
        continue;
      }
      ctx.fillStyle="#fff"; ctx.strokeStyle=OUT; ctx.lineWidth=OL*0.8;
      ctx.beginPath(); ctx.ellipse(ex, ey, eR*(eyeStyle===1?0.68:0.95), eR, 0,0,7); ctx.stroke(); ctx.fill();
      ctx.fillStyle="#16121d";
      ctx.beginPath(); ctx.arc(ex+eR*0.1, ey+eR*0.08, eR*(eyeStyle===2?0.62:0.46),0,7); ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(ex+eR*0.3, ey-eR*0.26, eR*0.2,0,7); ctx.fill();
    }
    ctx.strokeStyle=OUT; ctx.lineWidth=OL;
    const my = fy + r*0.44, mw = r*0.2;
    ctx.beginPath();
    if(mouthStyle===0){ ctx.moveTo(fx-mw,my); ctx.quadraticCurveTo(fx,my+r*0.24,fx+mw,my); ctx.stroke(); }
    else if(mouthStyle===1){ ctx.moveTo(fx-mw,my); ctx.lineTo(fx,my+r*0.2); ctx.lineTo(fx+mw,my); ctx.stroke(); }
    else if(mouthStyle===2){ ctx.moveTo(fx-mw,my+r*0.14); ctx.quadraticCurveTo(fx,my-r*0.08,fx+mw,my+r*0.14); ctx.stroke(); }
    else { ctx.fillStyle=hsl(h+330,58,30);
      ctx.ellipse(fx,my+r*0.04,mw*0.6,r*0.14,0,0,7); ctx.fill(); ctx.stroke(); }
  }

  const patt = Math.floor(rng()*4);
  function pattern(x,y,rx,ry){
    if(patt===3) return;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.clip();
    if(patt===0){ ctx.globalAlpha=.45; ctx.fillStyle=CD;
      for(let i=0;i<5;i++){ ctx.beginPath();
        ctx.ellipse(x-rx*0.7+rng()*rx*1.4, y-ry*0.6+rng()*ry*1.2, rx*0.16, ry*0.13, rng(),0,7); ctx.fill(); } }
    else if(patt===1){ ctx.globalAlpha=.4; ctx.strokeStyle=CD; ctx.lineWidth=OL*1.8;
      for(let i=-2;i<=2;i++){ ctx.beginPath();
        ctx.moveTo(x-rx, y+i*ry*0.36); ctx.lineTo(x+rx, y+i*ry*0.36 - ry*0.16); ctx.stroke(); } }
    else { ctx.globalAlpha=.85; ctx.fillStyle=CL;
      ctx.beginPath(); ctx.ellipse(x, y+ry*0.34, rx*0.56, ry*0.5, 0,0,7); ctx.fill(); }
    ctx.restore();
  }

  const crest = Math.floor(rng()*5);
  function crests(fx, fy, r){
    if(crest===0) return;
    if(crest===1){ for(const sg of [-1,1]) poly([
        [fx+sg*r*0.5, fy-r*0.62],[fx+sg*r*1.02, fy-r*1.72],[fx+sg*r*0.06, fy-r*0.96]], C); }
    else if(crest===2){ for(const sg of [-1,1]) ell(fx+sg*r*0.86, fy-r*0.8, r*0.24, r*0.58, sg*0.5, C); }
    else if(crest===3){ poly([[fx-r*0.22,fy-r*0.84],[fx,fy-r*1.66],[fx+r*0.22,fy-r*0.84]], CA); }
    else { for(const sg of [-1,1]){
        curveLimb(fx+sg*r*0.3, fy-r*0.78, fx+sg*r*0.9, fy-r*1.5, fx+sg*r*0.55, fy-r*1.9, OL*1.2, C);
        ell(fx+sg*r*0.55, fy-r*1.96, r*0.17, r*0.17, 0, CA); } }
  }

  const plan = ["blob","biped","quad","serpent","floater","winged","shell"][Math.floor(rng()*7)];
  const bulk = clamp(0.76 + (mon.hp/170)*0.36, 0.76, 1.12);

  if(plan==="blob"){
    const rx = W*(0.20+rng()*0.10)*bulk, ry = rx*(0.68+rng()*0.5);
    const by = ground - ry*0.94;
    shadow(cx, ground+ry*0.06, rx*1.02);
    for(const sg of [-1,1]) ell(cx+sg*rx*0.52, ground-ry*0.08, rx*0.26, ry*0.17, 0, CD);
    ell(cx, by, rx, ry, 0, C);
    pattern(cx, by, rx, ry);
    crests(cx, by-ry*0.1, rx*0.75);
    face(cx, by-ry*0.02, rx*0.8);

  } else if(plan==="biped"){
    const rx = W*(0.12+rng()*0.06)*bulk, ry = rx*(1.15+rng()*0.55);
    const legL = H*(0.10+rng()*0.07);
    const by = ground - legL - ry*0.9;
    const headR = rx*(0.72+rng()*0.3);
    const hy = by - ry - headR*0.62;
    shadow(cx, ground+2, rx*1.1);
    for(const sg of [-1,1]) limb(cx+sg*rx*0.42, by+ry*0.6, cx+sg*rx*0.56, ground-OL, OL*2.2, C);
    for(const sg of [-1,1]) ell(cx+sg*rx*0.62, ground-OL*1.4, rx*0.3, ry*0.12, 0, CD);
    for(const sg of [-1,1]) curveLimb(cx+sg*rx*0.8, by-ry*0.1, cx+sg*rx*1.5, by+ry*0.2, cx+sg*rx*1.15, by+ry*0.6, OL*2, C);
    ell(cx, by, rx, ry, 0, C);
    pattern(cx, by, rx, ry);
    ell(cx, hy, headR*1.04, headR, 0, C);
    crests(cx, hy, headR);
    face(cx, hy+headR*0.04, headR*0.94);

  } else if(plan==="quad"){
    const rx = W*(0.17+rng()*0.08)*bulk, ry = rx*(0.46+rng()*0.22);
    const legL = H*(0.08+rng()*0.06);
    const by = ground - legL - ry*0.8;
    const dir = rng()<0.5 ? -1 : 1;
    const headR = rx*(0.44+rng()*0.18);
    const hx = cx + dir*(rx*0.92), hy = by - ry*0.62;
    shadow(cx, ground+2, rx*1.15);
    curveLimb(cx-dir*rx*0.94, by, cx-dir*rx*1.5, by-ry*0.5, cx-dir*rx*1.6, by-ry*1.3, OL*2.2, CD);
    for(const o of [-0.62,-0.2,0.24,0.66]) limb(cx+o*rx, by+ry*0.62, cx+o*rx*1.1, ground-OL, OL*2.1, CD);
    ell(cx, by, rx, ry, 0, C);
    pattern(cx, by, rx, ry);
    curveLimb(hx-dir*rx*0.2, by-ry*0.2, hx, hy+headR*0.5, hx, hy+headR*0.2, OL*3.2, C);
    ell(hx, hy, headR*1.05, headR, 0, C);
    crests(hx, hy, headR);
    face(hx, hy+headR*0.04, headR*0.92);

  } else if(plan==="serpent"){
    const segs = 5+Math.floor(rng()*3);
    const amp = W*(0.10+rng()*0.09);
    const top = H*(0.24+rng()*0.1);
    const span = ground-top;
    shadow(cx, ground+2, amp*1.5);
    ctx.strokeStyle=OUT; ctx.lineCap="round";
    for(let pass=0; pass<2; pass++){
      ctx.strokeStyle = pass? C : OUT;
      ctx.beginPath();
      for(let i=0;i<=segs;i++){
        const t=i/segs, y=ground-span*t, x=cx+Math.sin(t*Math.PI*1.9+rng()*0.001)*amp*(1-t*0.35);
        i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      }
      ctx.lineWidth = (pass? W*0.085 : W*0.085+OL*2)*bulk;
      ctx.stroke();
    }
    const headR = W*0.075*bulk*(1.1+rng()*0.4);
    const hy = top - headR*0.2, hx = cx+Math.sin(Math.PI*1.9)*amp*0.65;
    ell(hx, hy, headR*1.1, headR, 0, C);
    crests(hx, hy, headR);
    face(hx, hy+headR*0.04, headR*0.95);

  } else if(plan==="floater"){
    const r = W*(0.13+rng()*0.07)*bulk;
    const by = ground - r*2.0;
    shadow(cx, ground, r*0.8);
    const orbit = 2+Math.floor(rng()*3);
    for(let i=0;i<orbit;i++){
      const a = rng()*Math.PI*2, d = r*(1.5+rng()*0.55);
      ell(cx+Math.cos(a)*d, by+Math.sin(a)*d*0.7, r*0.22, r*0.22, 0, CA);
    }
    if(rng()<0.5) for(const sg of [-1,1])
      curveLimb(cx+sg*r*0.5, by+r*0.85, cx+sg*r*0.9, by+r*1.6, cx+sg*r*0.4, by+r*2.0, OL*1.4, CD);
    ell(cx, by, r, r*(0.9+rng()*0.3), 0, C);
    pattern(cx, by, r, r);
    crests(cx, by, r*0.9);
    face(cx, by, r*0.95);

  } else if(plan==="winged"){
    const rx = W*(0.11+rng()*0.05)*bulk, ry = rx*(1.0+rng()*0.4);
    const by = ground - H*0.13 - ry*0.8;
    shadow(cx, ground+2, rx*1.3);
    for(const sg of [-1,1]) poly([
      [cx+sg*rx*0.55, by-ry*0.35],
      [cx+sg*rx*2.5,  by-ry*1.25],
      [cx+sg*rx*2.25, by+ry*0.22],
      [cx+sg*rx*1.35, by-ry*0.1]], CL);
    for(const sg of [-1,1]) limb(cx+sg*rx*0.4, by+ry*0.75, cx+sg*rx*0.5, ground-OL, OL*1.6, CD);
    ell(cx, by, rx, ry, 0, C);
    pattern(cx, by, rx, ry);
    const headR = rx*0.82;
    ell(cx, by-ry-headR*0.45, headR*1.02, headR, 0, C);
    crests(cx, by-ry-headR*0.45, headR);
    face(cx, by-ry-headR*0.42, headR*0.92);

  } else {
    const rx = W*(0.17+rng()*0.07)*bulk, ry = rx*(0.62+rng()*0.2);
    const by = ground - ry*0.85;
    shadow(cx, ground+ry*0.06, rx*1.05);
    for(const sg of [-1,1]) ell(cx+sg*rx*0.72, ground-ry*0.14, rx*0.24, ry*0.2, sg*0.3, CD);
    ell(cx, by+ry*0.24, rx*0.86, ry*0.62, 0, CL);
    ink(); ctx.fillStyle=C;
    ctx.beginPath(); ctx.ellipse(cx, by, rx, ry, 0, Math.PI, 0); ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,by,rx,ry,0,Math.PI,0); ctx.clip();
    ctx.globalAlpha=.5; ctx.strokeStyle=CD; ctx.lineWidth=OL*1.6;
    for(let i=1;i<4;i++){ ctx.beginPath(); ctx.ellipse(cx,by,rx*(i/4),ry*(i/4),0,Math.PI,0); ctx.stroke(); }
    ctx.restore();
    const headR = rx*(0.36+rng()*0.14);
    const hy = by - ry*0.1;
    ell(cx, hy - headR*0.2, headR*1.05, headR, 0, C);
    crests(cx, hy-headR*0.2, headR);
    face(cx, hy-headR*0.16, headR*0.92);
  }

  ctx.save(); ctx.globalAlpha=.13;
  drawTypeGlyph(ctx, mon.type, W*.85, H*.15, W*.085, "#fff");
  ctx.restore();

  ctx.restore();
}

/* ============================================================
   4. Card faces
   ============================================================ */
const CARD_W = 512, CARD_H = 716;
const CARD_FONT = '"Trebuchet MS","Segoe UI",Arial,sans-serif';

function statsFor(mon){
  const rng = mulberry32(hashStr(mon.name+"·stats"));
  const moves = MOVES[mon.type].slice();
  const a1 = moves.splice(Math.floor(rng()*moves.length),1)[0];
  const a2 = moves.splice(Math.floor(rng()*moves.length),1)[0];
  const two = mon.hp >= 70;
  const base = Math.round((mon.hp/10)) * 2;
  return {
    attacks: two
      ? [{cost:1, name:a1, dmg:base-10}, {cost:mon.hp>=110?3:2, name:a2, dmg:base+20}]
      : [{cost:1, name:a1, dmg:Math.max(10,base-10)}],
    retreat: mon.hp>=110?3:mon.hp>=70?2:1,
    stage: mon.rarity==="C"?"Basic":mon.rarity==="U"?"Stage 1":"Stage 2"
  };
}

function energyPip(ctx,x,y,r,type){
  const T=TYPES[type];
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,shade(T.c,.5)); g.addColorStop(1,T.d);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=r*.12; ctx.stroke();
  drawTypeGlyph(ctx,type,x,y,r*.62,"rgba(255,255,255,.92)");
}

function raritySymbol(ctx,x,y,r,rarity,holo){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = holo ? "#c9971f" : "#22222a";
  if(rarity==="C"){ ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); }
  else if(rarity==="U"){ ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*.78,0); ctx.lineTo(0,r); ctx.lineTo(-r*.78,0); ctx.closePath(); ctx.fill(); }
  else { ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rad=i%2?r*.45:r*1.15; ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
    ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

// Returns {front:canvas, mask:canvas, edge:css colour for the card's sides}
function buildCardFace(card, opts){
  const mon = card.mon, T = TYPES[mon.type], st = card.stats;
  const c = document.createElement("canvas"); c.width=CARD_W; c.height=CARD_H;
  const ctx = c.getContext("2d");
  const R = 30;

  const artX=42, artY=136, artW=CARD_W-84, artH=286;

  // --- border ---
  // Species colour where there is one, type colour otherwise. The type still
  // owns the pips, glyphs and ink, so nothing semantic is lost.
  const meta = speciesMeta(mon);
  const A = (meta && SPECIES_PALETTE[meta.color]) || {c:T.c, d:T.d};
  const bg = ctx.createLinearGradient(0,0,CARD_W,CARD_H);
  bg.addColorStop(0, shade(A.c,.34)); bg.addColorStop(.5, A.c); bg.addColorStop(1, A.d);
  rr(ctx,0,0,CARD_W,CARD_H,R); ctx.fillStyle=bg; ctx.fill();
  // border texture
  ctx.save(); rr(ctx,0,0,CARD_W,CARD_H,R); ctx.clip();
  ctx.globalAlpha=.16; ctx.strokeStyle="#fff"; ctx.lineWidth=2;
  for(let i=-CARD_H;i<CARD_W;i+=16){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+CARD_H,CARD_H); ctx.stroke(); }
  ctx.restore();

  // --- inner panel ---
  const P=18;
  rr(ctx,P,P,CARD_W-P*2,CARD_H-P*2,R-9);
  const inner=ctx.createLinearGradient(0,P,0,CARD_H-P);
  // Tint the panel toward the species colour too, or a purple-framed card ends
  // up with a green panel. Shaded well toward white so the type's dark ink
  // keeps its contrast whatever the species colour is.
  inner.addColorStop(0,"#fbfaf6"); inner.addColorStop(1, shade(A.c,.78));
  ctx.fillStyle=inner; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.22)"; ctx.lineWidth=2; ctx.stroke();

  // --- header ---
  // Laid out right to left from measured widths. Fixed x positions collided:
  // a three-digit HP is wider than the gap that was reserved for it.
  ctx.textBaseline="alphabetic";
  ctx.font="800 40px "+CARD_FONT;
  const hpNumW = ctx.measureText(String(mon.hp)).width;
  ctx.font="700 17px "+CARD_FONT;
  const hpLabW = ctx.measureText("HP").width;

  const pipR = 19, pipCx = CARD_W - 46 - pipR;
  const hpNumRight = pipCx - pipR - 10;
  const hpLabRight = hpNumRight - hpNumW - 9;
  const hpLeft     = hpLabRight - hpLabW;

  ctx.font="700 11px "+CARD_FONT;
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillText(st.stage.toUpperCase(), 44, 66);

  const maxNameW = hpLeft - 42 - 16;
  let nameSize=39;
  ctx.font="800 "+nameSize+"px "+CARD_FONT;
  while(ctx.measureText(mon.name).width > maxNameW && nameSize>22){
    nameSize-=1; ctx.font="800 "+nameSize+"px "+CARD_FONT;
  }
  ctx.fillStyle=T.ink;
  ctx.fillText(mon.name, 42, 106);

  ctx.textAlign="right";
  ctx.font="800 40px "+CARD_FONT; ctx.fillStyle=T.ink;
  ctx.fillText(String(mon.hp), hpNumRight, 105);
  ctx.font="700 17px "+CARD_FONT; ctx.fillStyle="rgba(0,0,0,.6)";
  ctx.fillText("HP", hpLabRight, 102);
  ctx.textAlign="left";
  energyPip(ctx, pipCx, 92, pipR, mon.type);

  // --- art window ---
  ctx.save();
  rr(ctx,artX-6,artY-6,artW+12,artH+12,10);
  // Colours the 6px lip around the window, and stands in as the whole
  // background for any Pokemon the bundle has no habitat for.
  const ground = (meta && HABITAT_GROUNDS[meta.habitat]) || DEFAULT_GROUND;
  const fg=ctx.createLinearGradient(artX,artY,artX+artW,artY+artH);
  fg.addColorStop(0,ground[0]); fg.addColorStop(.5,ground[1]); fg.addColorStop(1,ground[2]);
  ctx.fillStyle=fg; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
  // A landscape for the habitat, over the gradient (which still colours the
  // 6px lip around the window). Falls back to the plain gradient when the
  // bundle carries no metadata.
  if(meta && meta.habitat){
    drawHabitatScene(ctx, meta.habitat, mon.name, artX, artY, artW, artH);
  }

  // The inner border is stroked before the art rather than after it, so that
  // the animation plate below captures it. The sprite is inset by `pad` and
  // never reached this border anyway, so nothing moves visually.
  ctx.save(); ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=2;
  ctx.strokeRect(artX,artY,artW,artH); ctx.restore();
  // Sprite art keyed by National Dex number, drawn into the existing art
  // window so the card layout, holo mask, and Three.js flip/tilt behavior
  // remain unchanged.
  const rec = SPRITE_IMAGES[mon.name];
  card.art = null;
  if(rec && rec.img.complete && rec.img.naturalWidth){
    // The sprite gets its own canvas, which becomes the texture of a quad
    // sitting in front of the card. Created for still sprites too, not just
    // animated ones: a CDN-sourced GIF decodes to a single frame, and it
    // should still sit on the quad rather than vanishing.
    //
    // No plate any more. The canvas holds only the sprite on transparency, so
    // stepping a frame clears it rather than repainting a background over it.
    const artCanvas = document.createElement("canvas");
    artCanvas.width = artW; artCanvas.height = artH;
    const actx = artCanvas.getContext("2d");
    card.art = {x:artX, y:artY, w:artW, h:artH, rec, frame:0,
                // Offset each card within its loop so ten cards in a pack
                // don't all breathe in unison.
                phase: Math.random()*(rec.total||1),
                canvas: artCanvas, ctx: actx};
    // Frame 0 up front: stepCardArt only runs for the card in focus, so
    // without this every other card in the stack would be empty.
    drawSpriteFrame(actx, rec, 0, 0, 0, artW, artH);
    // Drawn into the face only for flat renders (the binder). In the scene the
    // sprite lives on its own quad, so drawing it here too would double it.
    if(opts && opts.flatSprite) drawSpriteFrame(ctx, rec, 0, artX, artY, artW, artH);
  } else {
    // Only used if the sprite is missing (blocked host, or not yet loaded).
    drawCreature(ctx, artX, artY, artW, artH, mon);
  }

  // --- info strip ---
  ctx.fillStyle="rgba(0,0,0,.62)"; ctx.font="italic 12.5px "+CARD_FONT;
  const tail = (meta && meta.genus) || "Kanto Series";
  ctx.fillText(`No. ${String(NUMBERS[mon.name]).padStart(3,"0")}   ·   ${T.name} type   ·   ${tail}`, 44, artY+artH+26);

  // --- attacks ---
  let y = artY+artH+52;
  ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(44,y); ctx.lineTo(CARD_W-44,y); ctx.stroke();
  y += 12;
  st.attacks.forEach((atk,ai)=>{
    const rowH = 62;
    let px = 54;
    for(let i=0;i<atk.cost;i++){ energyPip(ctx, px, y+22, 15, i===0?mon.type:"C"); px += 34; }
    ctx.fillStyle="#171520"; ctx.font="700 25px "+CARD_FONT;
    ctx.fillText(atk.name, Math.max(px+6, 130), y+31);
    ctx.textAlign="right"; ctx.font="800 30px "+CARD_FONT; ctx.fillStyle="#171520";
    ctx.fillText(String(atk.dmg), CARD_W-48, y+32); ctx.textAlign="left";
    y += rowH;
    // rule between attacks only — a trailing one lands on top of the footer rule
    if(ai < st.attacks.length-1){
      ctx.strokeStyle="rgba(0,0,0,.12)";
      ctx.beginPath(); ctx.moveTo(44,y-8); ctx.lineTo(CARD_W-44,y-8); ctx.stroke();
    }
  });

  // --- footer stats ---
  const fy = CARD_H-92;
  ctx.strokeStyle="rgba(0,0,0,.2)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(44,fy-16); ctx.lineTo(CARD_W-44,fy-16); ctx.stroke();
  ctx.font="700 10.5px "+CARD_FONT; ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.fillText("weakness", 46, fy); ctx.fillText("resistance", 188, fy); ctx.fillText("retreat", 336, fy);
  energyPip(ctx, 60, fy+20, 12, WEAK[mon.type]);
  ctx.font="700 13px "+CARD_FONT; ctx.fillStyle="#171520"; ctx.fillText("×2", 76, fy+25);
  if(RESIST[mon.type]){ energyPip(ctx, 202, fy+20, 12, RESIST[mon.type]);
    ctx.fillText("−30", 218, fy+25); }
  else { ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillText("—", 196, fy+25); }
  for(let i=0;i<st.retreat;i++) energyPip(ctx, 348+i*26, fy+20, 12, "C");

  // --- flavour + number ---
  ctx.font="italic 12px "+CARD_FONT; ctx.fillStyle="rgba(0,0,0,.55)";
  const flav = FLAVOR[mon.type];
  ctx.fillText(flav.length>66?flav.slice(0,64)+"…":flav, 46, CARD_H-38);
  ctx.font="700 11px "+CARD_FONT; ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.textAlign="right";
  ctx.fillText(`${String(NUMBERS[mon.name]).padStart(3,"0")}/151`, CARD_W-64, CARD_H-37);
  ctx.textAlign="left";
  raritySymbol(ctx, CARD_W-50, CARD_H-42, 8, mon.rarity, card.holo!=="none");

  // holo stamp — sits on the info strip, not over the artwork
  if(card.holo==="rare"){
    ctx.save();
    ctx.textAlign="right";
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.font="800 11px "+CARD_FONT;
    ctx.fillText("HOLO RARE", CARD_W-46, artY+artH+26);
    ctx.restore();
    ctx.textAlign="left";
  }

  /* ---------- holo mask ---------- */
  const m = document.createElement("canvas"); m.width=CARD_W>>1; m.height=CARD_H>>1;
  const mc = m.getContext("2d"); const s=0.5;
  mc.fillStyle="#000"; mc.fillRect(0,0,m.width,m.height);
  if(card.holo==="rare"){
    mc.fillStyle="#fff"; mc.fillRect(artX*s, artY*s, artW*s, artH*s);
  } else if(card.holo==="reverse"){
    mc.save(); rr(mc,P*s,P*s,(CARD_W-P*2)*s,(CARD_H-P*2)*s,(R-9)*s); mc.fillStyle="#fff"; mc.fill();
    mc.globalCompositeOperation="destination-out";
    mc.fillRect(artX*s, artY*s, artW*s, artH*s);
    mc.restore();
  }
  return {front:c, mask:m, edge:shade(A.d,-0.25)};
}

let BACK_CANVAS = null;
// Text set around a circle, a character at a time.
function arcText(ctx, text, cx, cy, radius, centerA, spread, o){
  ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font = o.font;
  for(let i=0;i<text.length;i++){
    const t = text.length===1 ? 0.5 : i/(text.length-1);
    const a = centerA - spread/2 + spread*t;
    ctx.save();
    ctx.translate(cx + Math.cos(a)*radius, cy + Math.sin(a)*radius);
    ctx.rotate(a + Math.PI/2);
    if(o.stroke){
      ctx.lineWidth = o.lineWidth || 7; ctx.strokeStyle = o.stroke;
      ctx.lineJoin = "round"; ctx.miterLimit = 2;
      ctx.strokeText(text[i], 0, 0);
    }
    ctx.fillStyle = o.fill; ctx.fillText(text[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

function buildCardBack(){
  if(BACK_CANVAS) return BACK_CANVAS;
  const c=document.createElement("canvas"); c.width=CARD_W; c.height=CARD_H;
  const ctx=c.getContext("2d"); const R=30;
  const cx=CARD_W/2, cy=CARD_H*0.455;          // ball sits just above centre
  const rnd = mulberry32(0x4b1d);              // fixed seed: the back never varies

  // Cream card stock, then the red keyline, then the navy field inside it --
  // the layering the original uses.
  rr(ctx,0,0,CARD_W,CARD_H,R); ctx.fillStyle="#fbf7ec"; ctx.fill();

  const inset = 15;
  ctx.save();
  rr(ctx, inset, inset, CARD_W-inset*2, CARD_H-inset*2, R-9); ctx.clip();
  ctx.fillStyle="#14306f"; ctx.fillRect(0,0,CARD_W,CARD_H);

  // Marbled field. The strokes are arcs centred on the ball, because the
  // original's brushwork circles the centre rather than running down the card.
  const maxR = Math.hypot(CARD_W, CARD_H)*0.62;
  for(let i=0;i<430;i++){
    const rad = 26 + rnd()*maxR;
    const a0 = rnd()*Math.PI*2, span = 0.22 + rnd()*1.45;
    ctx.strokeStyle = rnd() < 0.55
      ? "rgba(5,12,44," + (0.16+rnd()*0.40).toFixed(2) + ")"
      : "rgba(74,118,214," + (0.08+rnd()*0.28).toFixed(2) + ")";
    ctx.lineWidth = 3 + rnd()*17; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a0+span); ctx.stroke();
  }

  // Five broad bands, as the original has: two up, two down and one straight
  // down. Nothing points straight up, which is what leaves the navy clear
  // behind the wordmark.
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle = "#fdfbf3";
  const diag = Math.hypot(CARD_W, CARD_H);
  [30, 90, 150, 210, 330].forEach(deg=>{
    const a = deg*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0, 0, diag, a-0.235, a+0.235); ctx.closePath(); ctx.fill();
  });
  ctx.restore();

  // Wordmark arced over the ball.
  arcText(ctx, "KANTO SERIES", cx, cy, 158, -Math.PI/2, 2.74, {
    font: "800 38px " + CARD_FONT, fill: "#f6c828", stroke: "#3b2708", lineWidth: 8
  });

  // Ball. Red upper dome, a broad cream band that swells into a disc around
  // the button, and a gold-tan lower dome.
  //
  // The whole thing is tilted: measured off the reference, its pole leans 18
  // degrees, so the band runs up to the right rather than flat. Drawn level it
  // reads as a badge rather than a sphere someone photographed.
  const br = 122, TILT = -18*Math.PI/180;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,br,0,7); ctx.clip();

  // Hemispheres and band, in the ball's own tilted frame. Oversized so no
  // corner of a rect swings into view once rotated.
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(TILT);
  const S2 = br*1.6;
  const top = ctx.createLinearGradient(0, -br, 0, 0);
  top.addColorStop(0,"#c8121f"); top.addColorStop(.42,"#e8202f"); top.addColorStop(1,"#a50d1a");
  ctx.fillStyle=top; ctx.fillRect(-S2, -S2, S2*2, S2);
  const bot = ctx.createLinearGradient(0, 0, 0, br);
  bot.addColorStop(0,"#f0dca6"); bot.addColorStop(.38,"#d8b862"); bot.addColorStop(1,"#8a6a22");
  ctx.fillStyle=bot; ctx.fillRect(-S2, 0, S2*2, S2);
  ctx.fillStyle="#f7f1e0";
  ctx.fillRect(-S2, -br*0.125, S2*2, br*0.25);
  ctx.beginPath(); ctx.arc(0, 0, br*0.40, 0, 7); ctx.fill();
  ctx.restore();

  // Shading stays in screen space: the light does not tilt with the ball.
  const shade = ctx.createRadialGradient(cx-br*0.30, cy-br*0.34, br*0.12,
                                         cx-br*0.05, cy, br*1.16);
  shade.addColorStop(0,"rgba(255,255,255,.20)");
  shade.addColorStop(.52,"rgba(0,0,0,0)");
  shade.addColorStop(1,"rgba(0,0,0,.52)");
  ctx.fillStyle=shade; ctx.fillRect(cx-br, cy-br, br*2, br*2);

  ctx.save();
  ctx.translate(cx+br*0.34, cy-br*0.44); ctx.rotate(-0.5); ctx.scale(1, 0.72);
  const spec = ctx.createRadialGradient(0,0,1, 0,0, br*0.30);
  spec.addColorStop(0,"rgba(255,255,255,.92)"); spec.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=spec; ctx.beginPath(); ctx.arc(0,0,br*0.30,0,7); ctx.fill();
  ctx.restore();
  ctx.restore();

  ctx.beginPath(); ctx.arc(cx,cy,br,0,7);
  ctx.strokeStyle="#2b2118"; ctx.lineWidth=4; ctx.stroke();

  // Button on the ball's centre. It was offset to sit where the equator of a
  // leaning sphere would cross, which was defensible but read as a mistake --
  // the eye takes the button as the centre and the ball looked misaligned.
  const bcx = cx, bcy = cy;
  ctx.beginPath(); ctx.arc(bcx,bcy,br*0.30,0,7);
  ctx.fillStyle="#2b2118"; ctx.fill();
  const dome = ctx.createLinearGradient(bcx-br*0.2, bcy-br*0.26, bcx+br*0.18, bcy+br*0.26);
  dome.addColorStop(0,"#fdf0c4"); dome.addColorStop(.45,"#d9b45c"); dome.addColorStop(1,"#7d5c18");
  ctx.beginPath(); ctx.arc(bcx,bcy,br*0.255,0,7); ctx.fillStyle=dome; ctx.fill();
  [[0.19,"rgba(120,88,24,.55)"],[0.15,"rgba(253,240,196,.75)"],[0.10,"rgba(140,104,30,.5)"]].forEach(([r,col])=>{
    ctx.beginPath(); ctx.arc(bcx,bcy,br*r,0,7);
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  });

  // textAlign is reset here on purpose: the ribbon block set it to center
  // inside its own save/restore, so by this point it is back to the default
  // and the footer would run off to the right of centre.
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#9a1b22"; ctx.font="700 10px "+CARD_FONT;
  ctx.fillText("KANTO SERIES · 151 CARDS", cx, CARD_H-50);
  ctx.fillStyle="#4a2f10"; ctx.font="600 9px "+CARD_FONT;
  ctx.fillText("Fan-made set. Not affiliated with", cx, CARD_H-37);
  ctx.fillText("or endorsed by Nintendo.", cx, CARD_H-26);

  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.restore();

  // Red keyline last, over the field.
  ctx.strokeStyle="#d3232c"; ctx.lineWidth=3;
  rr(ctx, inset, inset, CARD_W-inset*2, CARD_H-inset*2, R-9); ctx.stroke();

  BACK_CANVAS=c; return c;
}

/* ============================================================
   5. Pack artwork
   ============================================================ */
const PACK_W=512, PACK_H=768, TEAR_AT=0.895; // fraction of height where body ends
function buildPackArt(){
  const c=document.createElement("canvas"); c.width=PACK_W; c.height=PACK_H;
  const ctx=c.getContext("2d");
  const rnd = mulberry32(0x9a1c);     // fixed: the wrapper is the same every pack
  const bodyH = PACK_H*TEAR_AT;       // the strip above TEAR_AT becomes the pack's top

  // Base foil. Real wrappers are metallised film, so the colour sits under hard
  // vertical specular bands rather than a soft gradient -- that banding is what
  // reads as foil rather than paper.
  const g=ctx.createLinearGradient(0,0,PACK_W*0.4,PACK_H);
  g.addColorStop(0,"#1a3fa8"); g.addColorStop(.34,"#1478c4");
  g.addColorStop(.63,"#6a28c8"); g.addColorStop(1,"#c02a86");
  ctx.fillStyle=g; ctx.fillRect(0,0,PACK_W,PACK_H);

  for(let x=-40; x<PACK_W+40; x+=13){
    const w = 3 + rnd()*11;
    const bright = rnd();
    ctx.globalAlpha = 0.05 + bright*0.17;
    ctx.fillStyle = bright > 0.80 ? "#ffffff" : (bright > 0.45 ? "#9fd0f2" : "#081038");
    ctx.fillRect(x + rnd()*5, 0, w, PACK_H);
  }
  ctx.globalAlpha=1;
  // A couple of broad sweeps, the highlight rolling across the film.
  [[0.22,"rgba(255,255,255,.20)"],[0.68,"rgba(255,236,190,.15)"]].forEach(([px,col])=>{
    const sg=ctx.createLinearGradient(PACK_W*px-90,0,PACK_W*px+90,0);
    sg.addColorStop(0,"rgba(255,255,255,0)"); sg.addColorStop(.5,col); sg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=sg; ctx.fillRect(0,0,PACK_W,PACK_H);
  });

  // Sunburst behind the logo.
  ctx.save(); ctx.translate(PACK_W/2, bodyH*0.30); ctx.globalAlpha=.10; ctx.fillStyle="#fff";
  for(let i=0;i<18;i++){ ctx.save(); ctx.rotate(i*Math.PI/9);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-14,-620); ctx.lineTo(14,-620); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.restore();

  ctx.textAlign="center";

  // Set logo: the same ball that is on the card back, small, above the wordmark.
  ctx.save(); ctx.translate(PACK_W/2, bodyH*0.13);
  const pr=30;
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,pr,0,7); ctx.clip();
  ctx.rotate(-18*Math.PI/180);
  ctx.fillStyle="#d6182b"; ctx.fillRect(-pr*1.6,-pr*1.6,pr*3.2,pr*1.6);
  ctx.fillStyle="#e6d29c"; ctx.fillRect(-pr*1.6,0,pr*3.2,pr*1.6);
  ctx.fillStyle="#f7f1e0"; ctx.fillRect(-pr*1.6,-pr*0.15,pr*3.2,pr*0.30);
  ctx.restore();
  ctx.beginPath(); ctx.arc(0,0,pr,0,7);
  ctx.strokeStyle="#2b2118"; ctx.lineWidth=3.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,pr*0.30,0,7); ctx.fillStyle="#2b2118"; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,pr*0.21,0,7); ctx.fillStyle="#f2e6bd"; ctx.fill();
  ctx.restore();

  // Wordmark.
  ctx.save(); ctx.translate(PACK_W/2, bodyH*0.30); ctx.rotate(-0.04);
  ctx.font="900 82px "+CARD_FONT;
  ctx.lineJoin="round"; ctx.lineWidth=19; ctx.strokeStyle="#150f34"; ctx.strokeText("KANTO",0,0);
  const lg=ctx.createLinearGradient(0,-60,0,12);
  lg.addColorStop(0,"#fffbe8"); lg.addColorStop(.48,"#ffd15c"); lg.addColorStop(1,"#e8891c");
  ctx.fillStyle=lg; ctx.fillText("KANTO",0,0);
  ctx.font="900 33px "+CARD_FONT; ctx.lineWidth=13;
  ctx.strokeStyle="#150f34"; ctx.strokeText("SERIES",0,44);
  ctx.fillStyle="#f6f2e6"; ctx.fillText("SERIES",0,44);
  ctx.restore();

  // Featured artwork. Packs put a character on the front; this uses a sprite we
  // already have loaded rather than shipping anything new. Fixed, not the pack's
  // own rare, which would give the pull away before it is opened.
  const star = SPRITE_IMAGES["Charizard"];
  if(star && star.img && star.img.complete && star.img.naturalWidth){
    const boxW = PACK_W*0.92, boxH = bodyH*0.46;
    const k = Math.min(boxW/star.fw, boxH/star.fh);
    const dw = star.fw*k, dh = star.fh*k;
    const dx = PACK_W/2 - dw/2, dy = bodyH*0.60 - dh/2;
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    // A silhouette for the shadow. Drawing a translucent copy of the sprite
    // instead just reads as a second, ghostly Charizard.
    const sil = silhouetteOf(star, 0, 0);
    ctx.globalAlpha=.30;
    ctx.drawImage(sil, 0,0,star.fw,star.fh, dx+9, dy+11, dw, dh);
    ctx.globalAlpha=1;
    ctx.drawImage(star.img, 0,0,star.fw,star.fh, dx, dy, dw, dh);
    ctx.restore();
  }

  // Bottom heat-seal crimp: fine vertical ridges, the way a wrapper is welded.
  const crimpH = bodyH*0.085, cy0 = bodyH - crimpH;
  ctx.fillStyle="#b9c4d8"; ctx.fillRect(0, cy0, PACK_W, crimpH);
  for(let x=0;x<PACK_W;x+=6){
    ctx.fillStyle = (x/6)%2 ? "rgba(255,255,255,.55)" : "rgba(40,54,92,.40)";
    ctx.fillRect(x, cy0, 3, crimpH);
  }
  ctx.fillStyle="rgba(10,16,44,.55)"; ctx.fillRect(0, cy0, PACK_W, 3);
  ctx.fillStyle="#243055"; ctx.font="600 12px "+CARD_FONT;
  ctx.fillText("KANTO SERIES · FAN-MADE · NOT FOR RESALE", PACK_W/2, cy0 + crimpH*0.66);

  // Tear strip. This band is the piece that ends up at the top of the pack.
  const ty = bodyH;
  ctx.fillStyle="#c6d0e2"; ctx.fillRect(0, ty, PACK_W, PACK_H-ty);
  for(let x=0;x<PACK_W;x+=6){
    ctx.fillStyle = (x/6)%2 ? "rgba(255,255,255,.60)" : "rgba(40,54,92,.34)";
    ctx.fillRect(x, ty, 3, PACK_H-ty);
  }
  ctx.strokeStyle="rgba(30,42,80,.85)"; ctx.lineWidth=3; ctx.setLineDash([11,9]);
  ctx.beginPath(); ctx.moveTo(0,ty+10); ctx.lineTo(PACK_W,ty+10); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#1e2a50"; ctx.font="800 16px "+CARD_FONT;
  ctx.fillText("◂ ◂   T E A R   O P E N   ▸ ▸", PACK_W/2, ty+52);
  ctx.textAlign="left";
  return c;
}
function cropCanvas(src, sy, sh){
  const c=document.createElement("canvas"); c.width=src.width; c.height=Math.round(sh);
  c.getContext("2d").drawImage(src, 0, sy, src.width, sh, 0, 0, src.width, sh);
  return c;
}
function buildPackBack(){
  const c=document.createElement("canvas"); c.width=PACK_W; c.height=PACK_H;
  const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,PACK_W,PACK_H);
  g.addColorStop(0,"#1b1a6e"); g.addColorStop(.5,"#2f1360"); g.addColorStop(1,"#0e2a55");
  ctx.fillStyle=g; ctx.fillRect(0,0,PACK_W,PACK_H);
  ctx.globalAlpha=.18; ctx.fillStyle="#fff";
  for(let y=0;y<PACK_H;y+=44) for(let x=(y/44)%2?22:0;x<PACK_W;x+=44){
    ctx.beginPath(); ctx.moveTo(x+22,y); ctx.lineTo(x+40,y+22); ctx.lineTo(x+22,y+44); ctx.lineTo(x+4,y+22);
    ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(PACK_W/2, PACK_H/2);
  const dg=ctx.createLinearGradient(-110,-110,110,110);
  dg.addColorStop(0,"#8ef7ea"); dg.addColorStop(.6,"#5a7cf5"); dg.addColorStop(1,"#c56cf0");
  ctx.fillStyle=dg;
  ctx.beginPath(); ctx.moveTo(0,-110); ctx.lineTo(88,0); ctx.lineTo(0,110); ctx.lineTo(-88,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=6; ctx.stroke();
  ctx.restore();
  return c;
}

/* ============================================================
   6. Pack generation logic
   ============================================================ */
function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;} return a; }

function generatePack(){
  const rng = Math.random;
  const used = new Set();
  function draw(tier){
    let m, guard=0;
    do { m = POOL[tier][Math.floor(rng()*POOL[tier].length)]; guard++; }
    while(used.has(m.name) && guard<60);
    used.add(m.name);
    return m;
  }
  const cards=[];
  for(let i=0;i<5;i++) cards.push({mon:draw("C"), holo:"none"});
  for(let i=0;i<3;i++) cards.push({mon:draw("U"), holo:"none"});
  // reverse holo slot: any common or uncommon
  cards.push({mon: draw(rng()<0.6?"C":"U"), holo:"reverse"});
  // rare slot, 1 in 3 is a holo
  cards.push({mon: draw("R"), holo: rng()<0.34 ? "rare" : "none"});
  cards.forEach(c=>{ c.stats = statsFor(c.mon); });

  // Randomize the final 10-card order so the sprite images appear
  // in a different order every pack while keeping the same rarity odds.
  shuffle(cards, rng);
  return cards;
}

/* ============================================================
   7. Audio
   ============================================================ */
const Audio2 = (function(){
  let ctx=null, muted=false, primed=false;
  function ac(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=new AC(); }
    if(ctx && ctx.state==="suspended") ctx.resume(); return ctx; }

  // Safari needs more than resume(). It only honours resume() from inside a
  // gesture callstack, and until a source has actually been started the
  // context stays effectively mute — currentTime doesn't advance while it is
  // suspended, so anything scheduled against it just queues up. Starting one
  // silent frame during the first real gesture is what actually opens it.
  function prime(){
    const c = ac();
    if(!c || primed) return;
    primed = true;
    try {
      const b = c.createBuffer(1, 1, c.sampleRate);
      const s = c.createBufferSource();
      s.buffer = b; s.connect(c.destination); s.start(0);
    } catch(e){ primed = false; }
  }
  // Catch the first gesture anywhere, not just the ones on the pack: the first
  // thing tapped might be the binder or the mute button.
  ["pointerdown","touchstart","mousedown","keydown"].forEach(ev=>{
    window.addEventListener(ev, prime, {capture:true, once:false, passive:true});
  });
  // Safari suspends the context when the tab goes to the background and does
  // not always bring it back on its own.
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden && ctx && ctx.state === "suspended") ctx.resume();
  });
  function env(node,t0,a,d,peak){ const g=node.gain; g.setValueAtTime(0.0001,t0);
    g.exponentialRampToValueAtTime(peak,t0+a); g.exponentialRampToValueAtTime(0.0001,t0+a+d); }
  // Cache the decaying-noise buffers by duration. Filling one is a JS loop over
  // thousands of samples and the tear asks for a dozen a second. Three variants
  // per duration keeps it from sounding like a loop.
  const noiseCache = new Map();
  function noiseBuffer(c, dur){
    const key = dur.toFixed(3);
    let bank = noiseCache.get(key);
    if(!bank){
      bank = [];
      const n = Math.floor(c.sampleRate*dur);
      for(let v=0; v<3; v++){
        const buf = c.createBuffer(1,n,c.sampleRate), d = buf.getChannelData(0);
        for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
        bank.push(buf);
      }
      noiseCache.set(key, bank);
    }
    return bank[(Math.random()*bank.length)|0];
  }
  function noise(dur,freq,q,vol){
    const c=ac(); if(!c||muted) return;
    const src=c.createBufferSource(); src.buffer=noiseBuffer(c, dur);
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=q;
    const g=c.createGain(); g.gain.value=vol;
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
  }
  function tone(freq,t,dur,type,vol){
    const c=ac(); if(!c||muted) return;
    const o=c.createOscillator(); const g=c.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    o.connect(g); g.connect(c.destination);
    const t0=c.currentTime+t; env(g,t0,0.012,dur,vol||0.16);
    o.start(t0); o.stop(t0+dur+0.06);
  }
  return {
    unlock(){ prime(); },
    setMuted(v){ muted=v; },
    isMuted(){ return muted; },
    rip(intensity){ noise(0.09, 1400+Math.random()*2200, 1.4, 0.13*intensity); },
    bigRip(){ noise(0.55, 1100, 0.8, 0.3); noise(0.4, 2600, 1.2, 0.18); },
    flip(){ noise(0.06, 3200, 2.0, 0.10); tone(520,0,0.05,"square",0.05); },
    whoosh(){ noise(0.22, 700, 0.7, 0.10); },
    tap(){ tone(760,0,0.05,"square",0.05); },
    holo(kind){
      const base = kind==="rare" ? [523.25,659.25,783.99,1046.5,1318.5] : [659.25,830.6,987.77,1318.5];
      base.forEach((f,i)=> tone(f, i*0.075, 0.5, "triangle", 0.12));
      if(kind==="rare"){ tone(1567.98, 0.42, 0.9, "sine", 0.1); tone(261.63, 0, 0.8, "sine", 0.08); }
    }
  };
})();

/* ============================================================
   8. Confetti / sparkle overlay
   ============================================================ */
const FX = (function(){
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
  let parts=[], dpr=1, W=0,H=0, running=false;
  function resize(){ dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener("resize",resize); resize();
  function burst(kind){
    const colors = kind==="rare"
      ? ["#ffd15c","#ffe9a8","#ff9f43","#fff","#ffb8e0","#42e8d8"]
      : ["#42e8d8","#8ef7ea","#ff4fa3","#fff","#a78bfa"];
    const n = kind==="rare" ? 120 : 80;
    const cx=W/2, cy=H*0.46;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=2.5+Math.random()*9.5;
      parts.push({
        x:cx+(Math.random()-.5)*70, y:cy+(Math.random()-.5)*70,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 3,
        w:4+Math.random()*8, h:5+Math.random()*11,
        rot:Math.random()*6.3, vr:(Math.random()-.5)*0.4,
        c:colors[(Math.random()*colors.length)|0], life:1,
        fade:0.006+Math.random()*0.008, shape: Math.random()<0.25?"c":"r"
      });
    }
    if(!running){ running=true; requestAnimationFrame(tick); }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.vy += 0.22; p.vx *= 0.992; p.vy *= 0.995;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.fade;
      if(p.life<=0 || p.y>H+60){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
      ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.shape==="c"){ ctx.beginPath(); ctx.arc(0,0,p.w*0.5,0,7); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(parts.length){ requestAnimationFrame(tick); } else { running=false; ctx.clearRect(0,0,W,H); }
  }
  return {burst};
})();
