<!doctype html>
<meta charset="utf-8">
<title>Kanto Pack Opener</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- GitHub Pages serves the repository root when its source is a branch rather
     than Actions, and without an index.html here Jekyll publishes README.md as
     the site. This hands the root over to the app instead. Kept as a redirect
     rather than a copy of the page so there is only ever one app file to edit.

     The Actions workflow publishes kanto-pack-opener.html as index.html
     directly, so it never serves this file. -->
<meta http-equiv="refresh" content="0; url=kanto-pack-opener.html">
<link rel="canonical" href="kanto-pack-opener.html">
<style>
  html{background:#0b0920;color:#cfc9ee;
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  body{display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;text-align:center}
  a{color:#8ef7ea}
</style>
<script>location.replace("kanto-pack-opener.html");</script>
<p>Opening the pack… <a href="kanto-pack-opener.html">continue</a> if nothing happens.</p>
